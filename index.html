    tw.appendChild(t);
    hosts.gridBody.appendChild(tw);

    if (pages > 1) hosts.gridBody.appendChild(pager(state.page.grid, pages, rows.length, function (p) {
      state.page.grid = p;
      renderGridBody();
      var w = hosts.gridBody.querySelector('.table-wrap');
      if (w) w.scrollTop = 0;
    }));
    restoreFocus(snap);
  }

  function commitEdit(p, field, value, label) {
    pushUndo(label || ('تعديل ' + (p.name || p.id)));
    p[field] = value;
    recompute();
    renderGridBody();
  }

  function gridCell(p, f, tierNames, poolNames) {
    var idBase = 'g-' + p.id + '-' + f.key;
    if (f.type === 'bool') {
      var cb = UI.checkbox({
        checked: !!p.excluded, size: 'sm', ariaLabel: 'استبعاد ' + (p.name || p.id),
        onChange: function (v) { commitEdit(p, 'excluded', v, (v ? 'استبعاد ' : 'إرجاع ') + (p.name || p.id)); }
      });
      cb.input.id = idBase;
      return cb;
    }
    if (f.type === 'tier' || f.type === 'pool') {
      var isTier = f.type === 'tier';
      var names = isTier ? tierNames : poolNames;
      var opts = [{ value: '', label: isTier ? '— بدون فئة —' : '— غير مقفول —' }];
      names.forEach(function (n) { opts.push({ value: n, label: n }); });
      var currentVal = isTier ? (p.tier || '') : (Engine.normalizePinnedPool(p.pinnedPool) || '');
      if (isTier && currentVal && names.indexOf(currentVal) === -1) {
        opts.push({ separator: true });
        opts.push({ value: currentVal, label: currentVal + ' (غير معرّفة)' });
      }
      var dd = UI.dropdown({
        options: opts, value: currentVal, size: 'sm',
        ariaLabel: f.label + ' لـ ' + (p.name || p.id),
        onChange: function (v) {
          commitEdit(p, isTier ? 'tier' : 'pinnedPool', isTier ? v : (v || null), 'تعديل ' + f.label);
        }
      });
      if (isTier && currentVal && names.indexOf(currentVal) === -1) {
        dd.firstChild.style.borderColor = 'var(--danger-line)';
        dd.firstChild.style.color = 'var(--danger)';
      }
      return dd;
    }
    var displayValue;
    if (f.type === 'pct') displayValue = p.penaltyRate == null ? '' : String(Math.round(p.penaltyRate * 10000) / 100);
    else if (f.key === 'daysWorked') displayValue = p.daysWorked == null ? '' : String(p.daysWorked);
    else displayValue = p[f.key] == null ? '' : String(p[f.key]);

    var inp = UI.input({
      id: idBase, value: displayValue, size: 'sm',
      numeric: f.numeric, type: f.type === 'text' ? 'text' : 'number',
      ariaLabel: f.label + ' لـ ' + (p.name || p.id),
      placeholder: f.key === 'daysWorked' ? String(state.periodDays) : (f.type === 'number' || f.type === 'pct' ? '—' : ''),
      onChange: function (v) {
        var val;
        if (f.type === 'text') {
          val = String(v).trim();
        } else if (f.type === 'pct') {
          var n = Fmt.parseNumber(v);
          val = n == null ? null : Engine.clamp(n / 100, 0, 1);
        } else {
          val = Fmt.parseNumber(v);
          if (val != null && f.key === 'daysWorked') val = Engine.clamp(Math.round(val), 0, state.periodDays);
          if (val != null && f.key === 'manualFactor' && val < 0) val = 0;
        }
        commitEdit(p, f.key, val, 'تعديل ' + f.label + ' لـ ' + (p.name || p.id));
      },
      onKeyDown: function (e) {
        if (e.key === 'Enter') { e.target.blur(); return; }
        if (e.key === 'Escape') { e.target.value = displayValue; e.target.blur(); return; }
        if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && f.type === 'text') {
          var all = Array.prototype.slice.call(document.querySelectorAll('[id^="g-"][id$="-' + f.key + '"]'));
          var i = all.indexOf(e.target);
          var nextEl = all[i + (e.key === 'ArrowDown' ? 1 : -1)];
          if (nextEl) { e.preventDefault(); nextEl.focus(); nextEl.select(); }
        }
      }
    });
    if (f.key === 'daysWorked' && p.daysWorked != null && (p.daysWorked < 0 || p.daysWorked > state.periodDays)) {
      inp.style.borderColor = 'var(--danger-line)';
    }
    return inp;
  }

  function openBulkEdit() {
    var rows = gridRows();
    var m = UI.modal({
      title: 'تعديل جماعي',
      subtitle: 'يُطبَّق على ' + Fmt.int(rows.length) + ' صف ظاهر حاليًا في الجدول'
    });
    var fieldKey = 'daysWorked';
    var value = '';
    var onlyEmpty = true;

    var body = el('div', 'stack g4');
    var fieldDd = UI.dropdown({
      options: [
        { value: 'daysWorked', label: 'أيام العمل' },
        { value: 'penaltyRate', label: 'نسبة الجزاء (%)' },
        { value: 'manualFactor', label: 'المعامل اليدوي' },
        { value: 'overrideValue', label: 'قيمة مخصصة' },
        { value: 'tier', label: 'الفئة' },
        { value: 'pinnedPool', label: 'المجمع المقفول' },
        { value: 'dept', label: 'القسم' },
        { value: 'excluded', label: 'استبعاد' },
        { value: 'notes', label: 'ملاحظات' }
      ],
      value: fieldKey,
      onChange: function (v) { fieldKey = v; paintValue(); }
    });
    fieldDd.firstChild.style.width = '100%';
    body.appendChild(UI.field('الحقل', fieldDd));

    var valueHost = el('div');
    body.appendChild(valueHost);
    function paintValue() {
      clearNode(valueHost);
      var control;
      if (fieldKey === 'tier' || fieldKey === 'pinnedPool') {
        var names = Object.keys(fieldKey === 'tier' ? state.tiers : state.pools);
        var opts = [{ value: '', label: fieldKey === 'tier' ? '— بدون فئة —' : '— فك القفل —' }];
        names.forEach(function (n) { opts.push({ value: n, label: n }); });
        control = UI.dropdown({ options: opts, value: value, onChange: function (v) { value = v; } });
        control.firstChild.style.width = '100%';
      } else if (fieldKey === 'excluded') {
        control = UI.dropdown({
          options: [{ value: '1', label: 'استبعاد' }, { value: '', label: 'إرجاع للتوزيع' }],
          value: value, onChange: function (v) { value = v; }
        });
        control.firstChild.style.width = '100%';
      } else {
        control = UI.input({
          value: value, numeric: fieldKey !== 'dept' && fieldKey !== 'notes',
          type: (fieldKey === 'dept' || fieldKey === 'notes') ? 'text' : 'number',
          placeholder: fieldKey === 'daysWorked' ? String(state.periodDays) : '',
          onInput: function (v) { value = v; }
        });
      }
      valueHost.appendChild(UI.field('القيمة الجديدة', control));
    }
    paintValue();

    body.appendChild(UI.checkbox({
      label: 'الخلايا الفارغة فقط (لا تستبدل قيمة موجودة)', checked: onlyEmpty,
      onChange: function (v) { onlyEmpty = v; }
    }));
    body.appendChild(UI.notice({
      tone: 'accent',
      text: 'التعديل الجماعي يُسجَّل كخطوة واحدة في التراجع، فتقدر ترجّعه كله بضغطة.'
    }));
    m.body.appendChild(body);

    m.foot.appendChild(btn('إلغاء', { variant: 'ghost', onClick: m.close }));
    m.foot.appendChild(btn('تطبيق', {
      variant: 'primary', onClick: function () {
        var parsed;
        if (fieldKey === 'excluded') parsed = value === '1';
        else if (fieldKey === 'tier') parsed = value;
        else if (fieldKey === 'pinnedPool') parsed = value || null;
        else if (fieldKey === 'dept' || fieldKey === 'notes') parsed = String(value).trim();
        else {
          var n = Fmt.parseNumber(value);
          if (n == null) { UI.toast('أدخل قيمة رقمية صحيحة', 'warn'); return; }
          parsed = fieldKey === 'penaltyRate' ? Engine.clamp(n / 100, 0, 1) : n;
          if (fieldKey === 'daysWorked') parsed = Engine.clamp(Math.round(parsed), 0, state.periodDays);
        }
        var ids = Object.create(null);
        rows.forEach(function (r) { ids[r.id] = true; });
        pushUndo('تعديل جماعي: ' + fieldKey);
        var touched = 0;
        state.people.forEach(function (p) {
          if (!ids[p.id]) return;
          var existing = p[fieldKey];
          var isEmpty = existing == null || existing === '' || existing === false;
          if (onlyEmpty && !isEmpty) return;
          p[fieldKey] = parsed;
          touched++;
        });
        recompute();
        m.close();
        renderGrid();
        UI.toast('تم تعديل ' + Fmt.int(touched) + ' صف', touched ? 'ok' : 'warn');
      }
    }));
  }

  function pager(current, pages, total, onGo) {
    var wrap = el('div', 'pager');
    var per = state.ui.rowsPerPage;
    var from = (current - 1) * per + 1;
    var to = Math.min(total, current * per);
    wrap.appendChild(el('div', 'pager-range', 'يظهر ' + Fmt.int(from) + '–' + Fmt.int(to) + ' من ' + Fmt.int(total)));
    var list = el('div', 'pager-list');
    function pbtn(label, page, disabled, isCurrent) {
      var b = el('button', 'pager-btn');
      b.type = 'button';
      b.appendChild(document.createTextNode(label));
      if (disabled) b.disabled = true;
      if (isCurrent) b.setAttribute('aria-current', 'page');
      if (!disabled && !isCurrent) b.addEventListener('click', function () { onGo(page); });
      return b;
    }
    list.appendChild(pbtn('‹', current - 1, current <= 1));
    var shown = [];
    for (var i = 1; i <= pages; i++) {
      if (i === 1 || i === pages || Math.abs(i - current) <= 1) shown.push(i);
    }
    var last = 0;
    shown.forEach(function (i) {
      if (i - last > 1) list.appendChild(el('span', 'pager-gap', '…'));
      list.appendChild(pbtn(Fmt.int(i), i, false, i === current));
      last = i;
    });
    list.appendChild(pbtn('›', current + 1, current >= pages));
    wrap.appendChild(list);
    var perDd = UI.dropdown({
      options: [{ value: '50', label: '50 / صفحة' }, { value: '100', label: '100 / صفحة' }, { value: '250', label: '250 / صفحة' }, { value: '500', label: '500 / صفحة' }],
      value: String(per), size: 'sm', align: 'end',
      onChange: function (v) { state.ui.rowsPerPage = Number(v); scheduleSave(); onGo(1); }
    });
    wrap.appendChild(perDd);
    return wrap;
  }

  function renderKpis() {
    if (!hosts.kpis) return;
    clearNode(hosts.kpis);
    var r = state.result;
    if (!r || !r.ok) return;
    var exec = Reports.executiveRows(state, r);
    var tot = exec.__totals;
    var rows = rowsCache();
    var paid = rows.filter(function (x) { return x.net > 0; }).length;
    var maxDrift = rows.reduce(function (m, x) { return Math.max(m, Math.abs(x.drift)); }, 0);
    var unresolved = (r.unresolvedTierIds || []).length;
    var cons = Reports.conservationCheck(state, r);

    var grid = el('div', 'kpi-row');

    var netNode = el('span', 'money money-xl');
    grid.appendChild(kpiCard('الصافي الموزّع', netNode, 'على ' + Fmt.int(paid) + ' مستحق من ' + Fmt.int(rows.length) + ' شخص', null, 'coins'));
    if (state.ui.kpiAnimated) {
      var parts = Fmt.splitMoney(tot.totalNet);
      netNode.appendChild(el('span', 'money-int', parts.int));
      netNode.appendChild(el('span', 'money-frac', parts.frac));
    } else {
      UI.countUp(netNode, tot.totalNet);
      state.ui.kpiAnimated = true;
    }

    grid.appendChild(kpiCard('إجمالي الخصومات', UI.moneyEGP(tot.totalTax, { size: 'lg' }),
      tot.totalGross > 0 ? Fmt.pct(tot.totalTax / tot.totalGross, 2) + ' من الإجمالي' : '—', 'info', 'sliders'));

    grid.appendChild(kpiCard('حفظ الإجمالي',
      cons.ok ? append(el('span', 'row g2'), [UI.badge('مطابق بالقرش', 'ok', 'ok')]) : UI.badge(Fmt.int(cons.problems.length) + ' مجمع غير مطابق', 'danger', 'danger'),
      cons.ok ? 'مجموع الأنصبة = إجمالي كل مجمع بعد التقريب، بلا فرق' : 'راجع ورقة المنهجية في التقرير',
      cons.ok ? 'ok' : 'danger', 'ok'));

    grid.appendChild(kpiCard('أقصى انحراف فردي', UI.moneyEGP(maxDrift, { size: 'lg' }),
      maxDrift < 1 ? 'أقل من جنيه — توزيع دقيق' : 'الفرق بين النصيب الفعلي والمثالي',
      maxDrift < 1 ? 'ok' : 'warn', 'chart'));

    grid.appendChild(kpiCard('نصيب النقطة', el('span', 'money money-lg', el('span', 'money-int', Fmt.egp(r.k, 4))),
      'كل نقطة في وزن الفئة تساوي هذا المبلغ صافيًا هذا الشهر', 'flat', 'layers'));

    if (unresolved > 0) {
      grid.appendChild(kpiCard('بدون فئة', el('span', 'money money-lg', el('span', 'money-int', Fmt.int(unresolved))),
        'خارج التوزيع — لم يحصلوا على شيء', 'danger', 'warn'));
    }
    var excluded = rows.filter(function (x) { return x.excluded; }).length;
    if (excluded > 0) {
      grid.appendChild(kpiCard('مستبعدون', el('span', 'money money-lg', el('span', 'money-int', Fmt.int(excluded))),
        'بقرار صريح منك', 'flat', 'lock'));
    }
    hosts.kpis.appendChild(grid);
  }

      nums.appendChild(n1);
      var n2 = el('div', 'stack');
      n2.appendChild(el('div', 'tiny muted', 'الصافي'));
      n2.appendChild(UI.moneyEGP(p.net, { currency: true }));
      nums.appendChild(n2);
      block.appendChild(nums);

      if (p.zeroBudget) {
        block.appendChild(el('div', 'tiny', 'هذا المجمع بلا مبلغ، والأعضاء المثبّتون عليه لن يحصلوا على شيء. اعطِه مبلغًا أو فُكّ أقفالهم.'));
      } else if (p.deviation != null) {
        var absDev = Math.abs(p.deviation);
        var tone = absDev < 0.02 ? 'is-ok' : (absDev < 0.08 ? 'is-warn' : 'is-danger');
        var meter = el('div', 'meter');
        var track = el('div', 'meter-track');
        var fill = el('div', 'meter-fill ' + tone);
        var pctFill = Math.min(100, (p.actualWeight / Math.max(p.targetWeight, 1e-9)) * 100);
        fill.style.width = Math.max(2, Math.min(100, pctFill)) + '%';
        track.appendChild(fill);
        var marker = el('div', 'meter-target');
        marker.style.insetInlineStart = 'calc(100% - 1px)';
        track.appendChild(marker);
        meter.appendChild(track);
        var legend = el('div', 'meter-legend');
        legend.appendChild(el('span', null, 'الوزن الفعلي ' + Fmt.egp(p.actualWeight, 0)));
        legend.appendChild(el('span', null, 'انحراف ' + Fmt.pct(p.deviation, 2)));
        legend.appendChild(el('span', null, 'المستهدف ' + Fmt.egp(p.targetWeight, 0)));
        meter.appendChild(legend);
        block.appendChild(meter);
      }
      body.appendChild(block);
    });
    card.appendChild(body);
    hosts.poolsHost.appendChild(card);
  }

  function renderCharts() {
    if (!hosts.chartsHost) return;
    clearNode(hosts.chartsHost);
    var stack = el('div', 'stack g4');

    var depts = Reports.deptRows(state, state.result).slice(0, 8);
    stack.appendChild(barChart('الصافي حسب القسم', depts.map(function (d) {
      return { name: d.dept, value: d.net, note: Fmt.int(d.count) + ' شخص' };
    })));

    var tiers = Reports.tierRows(state, state.result).slice(0, 8);
    stack.appendChild(barChart('الصافي حسب الفئة', tiers.map(function (t) {
      return { name: t.tier, value: t.net, note: Fmt.int(t.count) + ' شخص', alt: t.unresolved > 0 };
    })));

    hosts.chartsHost.appendChild(stack);
  }

  function barChart(title, items) {
    var card = el('div', 'chart-card');
    card.appendChild(el('div', 'section-label', title));
    if (!items.length) {
      card.appendChild(el('div', 'small muted', 'لا بيانات'));
      return card;
    }
    var max = items.reduce(function (m, i) { return Math.max(m, i.value); }, 0) || 1;
    var rows = el('div', 'chart-rows');
    items.forEach(function (it) {
      var row = el('div', 'chart-row');
      var nm = el('div', 'chart-name', it.name || '—');
      UI.attachTip(nm, (it.name || '—') + (it.note ? ' — ' + it.note : ''));
      row.appendChild(nm);
      var track = el('div', 'chart-track');
      var bar = el('div', 'chart-bar' + (it.alt ? ' alt' : ''));
      track.appendChild(bar);
      row.appendChild(track);
      var val = el('div', 'chart-val');
      val.appendChild(UI.moneyEGP(it.value));
      row.appendChild(val);
      rows.appendChild(row);
      requestAnimationFrame(function () { bar.style.width = Math.max(1.5, (it.value / max) * 100) + '%'; });
    });
    card.appendChild(rows);
    return card;
  }

  function renderToolbar() {
    if (!hosts.toolbar) return;
    clearNode(hosts.toolbar);
    var bar = el('div', 'toolbar');

    var sw = el('div', 'search-wrap');
    sw.appendChild(Icons.svg('search', 'search-icon'));
    var clearBtn = UI.iconBtn('x', 'مسح البحث', function () {
      state.filters.q = '';
      state.page.dashboard = 1;
      renderToolbar();
      renderTable();
    }, 'sm');
    clearBtn.classList.add('search-clear');
    clearBtn.style.visibility = state.filters.q ? 'visible' : 'hidden';
    var si = UI.input({
      id: 'dash-search', value: state.filters.q,
      placeholder: 'ابحث بالاسم أو القسم أو الفئة…', ariaLabel: 'بحث في الجدول',
      onInput: function (v) {
        state.filters.q = v;
        state.page.dashboard = 1;
        clearBtn.style.visibility = v ? 'visible' : 'hidden';
        if (searchTimer) clearTimeout(searchTimer);
        searchTimer = setTimeout(function () { renderTable(); renderCountOnly(); }, 90);
      }
    });
    sw.appendChild(si);
    sw.appendChild(clearBtn);
    bar.appendChild(sw);

    bar.appendChild(filterDropdown('القسم', 'dept', uniqueValues('dept')));
    bar.appendChild(filterDropdown('الفئة', 'tier', uniqueValues('tier')));
    bar.appendChild(filterDropdown('المجمع', 'pool', Object.keys(state.pools)));
    bar.appendChild(UI.dropdown({
      options: [{ value: 'simple', label: 'مبسّط' }, { value: 'full', label: 'مفصّل' }],
      value: state.ui.tableDetail === 'full' ? 'full' : 'simple',
      size: 'sm', ariaLabel: 'تفاصيل الجدول',
      onChange: function (v) {
        state.ui.tableDetail = v;
        scheduleSave();
        renderTable();
      }
    }));

    bar.appendChild(el('div', 'topbar-spacer'));
    hosts.count = el('div', 'toolbar-count');
    hosts.count.setAttribute('aria-live', 'polite');
    hosts.count.setAttribute('aria-atomic', 'true');
    bar.appendChild(hosts.count);
    bar.appendChild(btn('تصدير هذا العرض', {
      icon: 'download', size: 'sm', onClick: exportCurrentView
    }));
    hosts.toolbar.appendChild(bar);
    renderCountOnly();
  }

  function renderCountOnly() {
    if (!hosts.count) return;
    clearNode(hosts.count);
    var shown = viewRows().length;
    var total = rowsCache().length;
    hosts.count.appendChild(el('b', null, Fmt.int(shown)));
    hosts.count.appendChild(document.createTextNode(shown === total ? ' صف' : ' من ' + Fmt.int(total)));
    if (shown !== total) {
      hosts.count.appendChild(el('div', 'toolbar-trust', 'الإجماليات أعلى محسوبة على كل الصفوف'));
    }
  }

  function filterDropdown(label, key, values) {
    var opts = [{ value: '', label: 'كل ' + label, count: rowsCache().length }];
    var counts = Object.create(null);
    rowsCache().forEach(function (r) {
      var v = r[key];
      if (v) counts[v] = (counts[v] || 0) + 1;
    });
    values.forEach(function (v) { opts.push({ value: v, label: v, count: counts[v] || 0 }); });
    return UI.dropdown({
      options: opts, value: state.filters[key], size: 'sm', ariaLabel: 'فلتر ' + label,
      onChange: function (v) {
        state.filters[key] = v;
        state.page.dashboard = 1;
        renderChips();
        renderTable();
        renderCountOnly();
      }
    });
  }

  function renderChips() {
    if (!hosts.chips) return;
    clearNode(hosts.chips);
    var wrap = el('div', 'chip-row chip-row-scroll');
    wrap.style.margin = '0 0 var(--s3)';
    var rows = rowsCache();
    FLAGS.forEach(function (f) {
      var count = rows.filter(f.test).length;
      if (!count) return;
      var on = state.filters.flags.indexOf(f.key) !== -1;
      var c = el('button', 'chip');
      c.type = 'button';
      c.setAttribute('aria-pressed', on ? 'true' : 'false');
      c.appendChild(document.createTextNode(f.label));
      c.appendChild(el('span', 'chip-count', Fmt.int(count)));
      if (on) c.appendChild(Icons.svg('x', 'chip-x'));
      c.addEventListener('click', function () {
        var i = state.filters.flags.indexOf(f.key);
        if (i === -1) state.filters.flags.push(f.key);
        else state.filters.flags.splice(i, 1);
        state.page.dashboard = 1;
        renderChips();
        renderTable();
        renderCountOnly();
      });
      wrap.appendChild(c);
    });
    var active = activeFilterList();
    if (active.length) {
      wrap.appendChild(el('div', 'topbar-spacer'));
      wrap.appendChild(btn('مسح كل الفلاتر (' + Fmt.int(active.length) + ')', {
        size: 'sm', variant: 'ghost', icon: 'reset',
        onClick: function () {
          state.filters = { q: '', dept: '', tier: '', pool: '', flags: [] };
          state.sort = { key: null, dir: null };
          state.page.dashboard = 1;
          renderToolbar();
          renderChips();
          renderTable();
        }
      }));
    }
    if (wrap.childNodes.length) hosts.chips.appendChild(wrap);
  }

  function renderTable() {
    if (!hosts.table) return;
    var snap = captureFocus();
    clearNode(hosts.table);
    var rows = viewRows();
    var needle = state.__lastNeedle;
    var per = state.ui.rowsPerPage;
    var pages = Math.max(1, Math.ceil(rows.length / per));
    if (state.page.dashboard > pages) state.page.dashboard = pages;
    var slice = rows.slice((state.page.dashboard - 1) * per, (state.page.dashboard - 1) * per + per);

    if (!rows.length) {
      var card = el('div', 'card');
      card.appendChild(UI.emptyState(
        'لا صفوف مطابقة',
        activeFilterList().length ? 'الفلاتر الحالية لا تطابق أي شخص.' : 'لا يوجد أشخاص في الملف.',
        activeFilterList().length ? btn('مسح الفلاتر', {
          variant: 'primary', onClick: function () {
            state.filters = { q: '', dept: '', tier: '', pool: '', flags: [] };
            renderToolbar(); renderChips(); renderTable();
          }
        }) : null
      ));
      hosts.table.appendChild(card);
      return;
    }

    var showDetail = state.ui.tableDetail === 'full';
    var cols = COLUMNS.filter(function (c) { return showDetail || !c.detail; });

    var tw = el('div', 'table-wrap h-lg');
    var t = el('table', 'dt dt-wide dt-fixed' + (state.ui.density === 'compact' ? ' compact' : ''));
    var colgroup = el('colgroup');
    cols.forEach(function (c) {
      var col = el('col');
      col.style.width = c.width + 'px';
      colgroup.appendChild(col);
    });
    t.appendChild(colgroup);
    var thead = el('thead');
    var htr = el('tr');
    cols.forEach(function (c) {
      var th = el('th', (c.numeric ? 'num-col' : '') + (c.sortable ? ' sortable' : ''));
      var inner = el('div', 'th-inner');
      inner.appendChild(document.createTextNode(c.label));
      if (c.sortable) {
        inner.appendChild(Icons.svg('arrowUp', 'sort-ind'));
        if (state.sort.key === c.key && state.sort.dir) {
          th.setAttribute('aria-sort', state.sort.dir === 'asc' ? 'ascending' : 'descending');
        }
        th.setAttribute('tabindex', '0');
        th.setAttribute('role', 'columnheader');
        var doSort = function () {
          var dir = state.sort.key === c.key ? Sorter.nextDir(state.sort.dir) : 'asc';
          state.sort = { key: dir ? c.key : null, dir: dir };
          state.page.dashboard = 1;
          renderTable();
        };
        th.addEventListener('click', doSort);
        th.addEventListener('keydown', function (e) {
          if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); doSort(); }
        });
      }
      th.appendChild(inner);
      htr.appendChild(th);
    });
    thead.appendChild(htr);
    t.appendChild(thead);

    var tb = el('tbody');
    slice.forEach(function (r) {
      var tr = el('tr');
      if (r.unresolvedTier) tr.className = 'is-orphan';
      else if (r.excluded) tr.className = 'is-excluded';
      else if (r.special) tr.className = 'is-special';

      var nameTd = el('td', 'name-col');
      if (r.name) nameTd.title = r.name;
      nameTd.appendChild(Search.highlight(r.name || '—', needle));
      if (r.unresolvedTier) nameTd.appendChild(UI.badge('بدون فئة', 'danger'));
      else if (r.excluded) nameTd.appendChild(UI.badge('مستبعد', 'neutral'));
      else if (r.special) nameTd.appendChild(UI.attachTip(UI.badge('خاص', 'warn'), r.reason));
      tr.appendChild(nameTd);

      var deptTd = el('td', 'dept-col');
      if (r.dept) deptTd.title = r.dept;
      deptTd.appendChild(Search.highlight(r.dept || '—', needle));
      tr.appendChild(deptTd);

      tr.appendChild(el('td', null, Search.highlight(r.tier || '—', needle)));

      var poolTd = el('td', 'pool-col', r.pool || '—');
      if (r.pool) poolTd.title = r.pool;
      tr.appendChild(poolTd);

      if (showDetail) tr.appendChild(el('td', 'num-col small muted', Fmt.egp(r.weight, 4)));
      tr.appendChild(el('td', 'num-col', UI.moneyEGP(r.gross)));
      tr.appendChild(el('td', 'num-col', UI.moneyEGP(r.tax)));
      tr.appendChild(el('td', 'num-col', UI.moneyEGP(r.net)));
      if (showDetail) tr.appendChild(el('td', 'num-col', UI.delta(r.drift)));
      tb.appendChild(tr);
    });
    t.appendChild(tb);

    var tfoot = el('tfoot');
    var ftr = el('tr');
    var sums = slice.reduce(function (a, r) {
      a.gross += r.gross; a.tax += r.tax; a.net += r.net;
      return a;
    }, { gross: 0, tax: 0, net: 0 });
    ftr.appendChild(el('td', null, 'مجموع هذه الصفحة'));
    ftr.appendChild(el('td', null, ''));
    ftr.appendChild(el('td', null, ''));
    ftr.appendChild(el('td', null, Fmt.int(slice.length) + ' صف'));
    if (showDetail) ftr.appendChild(el('td', 'num-col', ''));
    ftr.appendChild(el('td', 'num-col', UI.moneyEGP(sums.gross)));
    ftr.appendChild(el('td', 'num-col', UI.moneyEGP(sums.tax)));
    ftr.appendChild(el('td', 'num-col', UI.moneyEGP(sums.net)));
    if (showDetail) ftr.appendChild(el('td', 'num-col', ''));
    tfoot.appendChild(ftr);
    t.appendChild(tfoot);

    tw.appendChild(t);
    hosts.table.appendChild(tw);

    if (pages > 1) hosts.table.appendChild(pager(state.page.dashboard, pages, rows.length, function (p) {
      state.page.dashboard = p;
      renderTable();
      var w = hosts.table.querySelector('.table-wrap');
      if (w) w.scrollTop = 0;
    }));
    restoreFocus(snap);
  }
  function baseFileName() {
    var t = (state.title || 'qisma').replace(/[\\\/:\*\?"<>\|]/g, ' ').trim();
    return t + ' - ' + Fmt.fileStamp(new Date());
  }

  function csvFallback(rows, filename, label) {
    try {
      Exporter.writeCsv(rows, filename);
      UI.toast('محرك Excel غير محمّل — تم تنزيل ' + label + ' بصيغة CSV بدلًا منه', 'warn', 6000);
      return true;
    } catch (e) {
      UI.toast('تعذّر التصدير: ' + (e && e.message ? e.message : 'خطأ غير معروف'), 'danger');
      return false;
    }
  }

  function guardXlsx() {
    if (!Exporter.available()) {
      UI.toast('مكتبة Excel غير محمّلة — التصدير غير متاح في هذه النسخة', 'danger');
      return false;
    }
    return true;
  }

  function exportFullReport() {
    if (!state.result || !state.result.ok) { UI.toast('صحّح الأخطاء قبل التصدير', 'warn'); return; }
    if (!Exporter.available()) {
      csvFallback(Exporter.detailAoa(state, state.result), baseFileName() + '.csv', 'التقرير التفصيلي');
      return;
    }
    try {
      var wb = Exporter.buildFullReport(state, state.result, { at: Date.now(), version: APP_VERSION });
      Exporter.write(wb, baseFileName() + '.xlsx');
      UI.toast('تم تنزيل التقرير الكامل', 'ok');
    } catch (e) {
      UI.toast('تعذّر إنشاء الملف: ' + (e && e.message ? e.message : 'خطأ غير معروف'), 'danger');
    }
  }

  function activeFilterLines() {
    var lines = [];
    if (state.filters.q) lines.push('بحث: ' + state.filters.q);
    if (state.filters.dept) lines.push('فلتر: القسم = ' + state.filters.dept);
    if (state.filters.tier) lines.push('فلتر: الفئة = ' + state.filters.tier);
    if (state.filters.pool) lines.push('فلتر: المجمع = ' + state.filters.pool);
    (state.filters.flags || []).forEach(function (k) {
      var def = FLAGS.filter(function (x) { return x.key === k; })[0];
      if (def) lines.push('فلتر: ' + def.label);
    });
    if (state.sort.key && state.sort.dir) {
      var col = COLUMNS.filter(function (c) { return c.key === state.sort.key; })[0];
      if (col) lines.push('ترتيب: ' + col.label + ' ' + (state.sort.dir === 'desc' ? 'تنازليًا' : 'تصاعديًا'));
    }
    return lines;
  }

  function viewAoa(rows) {
    var hdr = COLUMNS.map(function (c) { return c.label; });
    var body = rows.map(function (r) {
      return COLUMNS.map(function (c) {
        var v = c.get(r);
        return v == null ? '' : v;
      });
    });
    return [hdr].concat(body);
  }

  function exportCurrentView() {
    if (!state.result || !state.result.ok) { UI.toast('صحّح الأخطاء قبل التصدير', 'warn'); return; }
    var rows = viewRows();
    if (!rows.length) { UI.toast('لا صفوف ظاهرة لتصديرها', 'warn'); return; }
    if (!Exporter.available()) {
      csvFallback(viewAoa(rows), 'عرض - ' + (state.title || APP_NAME) + '.csv', 'العرض الحالي');
      return;
    }
    try {
      var wb = Exporter.buildViewExport({
        rows: rows,
        columns: COLUMNS.map(function (c) {
          return { label: c.label, get: c.get, format: c.format };
        }),
        filterLines: activeFilterLines()
      }, { at: Date.now(), title: state.title, period: state.period });
      Exporter.write(wb, 'عرض - ' + (state.title || APP_NAME) + ' - ' + (state.period || Fmt.isoDate(Date.now())) + '.xlsx');
      UI.toast('تم تنزيل ' + Fmt.int(rows.length) + ' صف كما تظهر على الشاشة', 'ok');
    } catch (e) {
      UI.toast('تعذّر إنشاء الملف', 'danger');
    }
  }

  function downloadTemplate(mode) {
    if (!Exporter.available()) {
      csvFallback(
        Exporter.templateRows(state, mode),
        'قالب - ' + (state.title || APP_NAME) + '.csv',
        'القالب'
      );
      return;
    }
    try {
      Exporter.write(
        Exporter.buildTemplate(state, mode),
        'قالب - ' + (state.title || APP_NAME) + ' - ' + Fmt.isoDate(Date.now()) + '.xlsx'
      );
      UI.toast(mode === 'current' ? 'تم تنزيل قالب بالبيانات الحالية' : 'تم تنزيل قالب فارغ', 'ok');
    } catch (e) {
      UI.toast('تعذّر إنشاء القالب', 'danger');
    }
  }

  function downloadJson(payload, filename) {
    var text = JSON.stringify(payload, null, 2);
    var blob = new Blob([text], { type: 'application/json;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function exportSettingsBundle() {
    openSettingsExportModal();
  }

  function settingsScopeCounts(scope) {
    var parts = [];
    if (scope.settings) {
      parts.push('الإعدادات (' + Fmt.int(Object.keys(state.tiers || {}).length) + ' فئة، ' + Fmt.int(Object.keys(state.pools || {}).length) + ' مجمع)');
    }
    if (scope.people) parts.push(Fmt.int((state.people || []).length) + ' صفًا');
    if (scope.special) parts.push(Fmt.int(Reports.specialCasePeople(state).length) + ' حالة خاصة');
    return parts.length ? 'سيتم تصدير: ' + parts.join(' + ') : 'لم تختر أي شيء بعد';
  }

  function openSettingsExportModal() {
    var scope = { settings: true, people: false, special: false };
    var format = 'xlsx';
    var m = UI.modal({
      title: 'تصدير الإعدادات',
      subtitle: 'اختر ما تريد تصديره وبأي صيغة'
    });

    var list = el('div', 'stack g3');
    var boxes = [
      { key: 'settings', label: 'الإعدادات', hint: 'الفئات والمجمعات ونسب الخصم ووحدة التقريب وأيام الفترة' },
      { key: 'people', label: 'جدول الأشخاص الحالي', hint: 'كل الأشخاص بنتائجهم — من كامل الملف، لا يتأثر بفلاتر الشاشة' },
      { key: 'special', label: 'الحالات الخاصة فقط', hint: 'المستبعدون والمقفولون وأصحاب الجزاء والقيم المخصصة — تُحسب من كامل الملف' }
    ];

    var summary = el('div', 'notice notice-accent');
    summary.setAttribute('aria-live', 'polite');
    var summaryText = el('div', null, settingsScopeCounts(scope));
    summary.appendChild(Icons.svg('info', 'notice-icon'));
    summary.appendChild(el('div', 'notice-body', summaryText));

    var exportBtn;
    function refresh() {
      clearNode(summaryText);
      summaryText.appendChild(document.createTextNode(settingsScopeCounts(scope)));
      var any = scope.settings || scope.people || scope.special;
      if (exportBtn) exportBtn.disabled = !any;
    }

    boxes.forEach(function (b) {
      var row = el('div', 'stack g2');
      row.appendChild(UI.checkbox({
        label: b.label, checked: scope[b.key],
        onChange: function (v) { scope[b.key] = v; refresh(); }
      }));
      var hint = el('div', 'field-help', b.hint);
      hint.style.marginInlineStart = '26px';
      row.appendChild(hint);
      list.appendChild(row);
    });
    m.body.appendChild(list);
    m.body.appendChild(el('div', 'divider'));

    var fmtField = el('div', 'stack g2');
    fmtField.appendChild(el('div', 'field-label', 'الصيغة'));
    var fmtDd = UI.dropdown({
      options: [
        { value: 'xlsx', label: 'Excel (xlsx) — للقراءة والطباعة' },
        { value: 'json', label: 'JSON — لإعادة الاستيراد في قسمة' }
      ],
      value: format,
      ariaLabel: 'صيغة التصدير',
      onChange: function (v) { format = v; refresh(); }
    });
    fmtDd.firstChild.style.width = '100%';
    fmtField.appendChild(fmtDd);
    m.body.appendChild(fmtField);
    m.body.appendChild(summary);

    exportBtn = btn('تصدير', {
      variant: 'primary', icon: 'download',
      onClick: function () {
        var stamp = Fmt.isoDate(Date.now());
        var base = 'إعدادات - ' + (state.title || APP_NAME) + ' - ' + stamp;
        if (format === 'json') {
          var bundle = { kind: 'qisma.settings', schemaVersion: Store.SCHEMA, appVersion: APP_VERSION, exportedAt: Date.now() };
          if (scope.settings) bundle.settings = persistableSettings();
          if (scope.people) bundle.people = state.people;
          if (scope.special) bundle.specialCases = Reports.specialCasePeople(state);
          downloadJson(bundle, base + '.json');
          m.close();
          UI.toast('تم تنزيل ملف JSON', 'ok');
          return;
        }
        if (!guardXlsx()) return;
        try {
          var wb = Exporter.buildSettingsExport(state, state.result, scope);
          Exporter.write(wb, base + '.xlsx');
          m.close();
          UI.toast('تم تنزيل ملف Excel', 'ok');
        } catch (e) {
          UI.toast('تعذّر إنشاء الملف', 'danger');
        }
      }
    });
    m.foot.appendChild(btn('إلغاء', { variant: 'ghost', onClick: m.close }));
    m.foot.appendChild(exportBtn);
    refresh();
    return m;
  }

  function confirmNewProject() {
    UI.confirmModal({
      title: 'بدء مشروع جديد؟',
      tone: 'danger', danger: true, confirmLabel: 'ابدأ من جديد',
      message: 'سيمسح كل البيانات غير المحفوظة: الملف الحالي وكل التعديلات اليدوية عليه. الفئات والمجمعات ستبقى كما هي. نزّل نسخة أولًا إن كنت تحتاج الرجوع لهذا العمل.',
      onConfirm: function () {
        var keepTiers = state.tiers, keepPools = state.pools, keepOptions = state.options, keepUi = state.ui;
        state = makeState();
        state.tiers = keepTiers; state.pools = keepPools; state.options = keepOptions; state.ui = keepUi;
        Store.clear('session');

  function exportSessionBundle() {
    downloadJson({
      kind: 'qisma.session', schemaVersion: Store.SCHEMA, appVersion: APP_VERSION,
      savedAt: Date.now(), session: persistableSession()
    }, 'نسخة قسمة - ' + Fmt.fileStamp(new Date()) + '.json');
    UI.toast('تم تنزيل نسخة كاملة من العمل', 'ok');
  }

  function importSettingsBundle() {
    var inp = document.createElement('input');
    inp.type = 'file';
    inp.accept = '.json';
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0];
      if (!f) return;
      var reader = new FileReader();
      reader.onload = function (e) {
        var data;
        try { data = JSON.parse(e.target.result); }
        catch (err) { UI.toast('الملف ليس JSON صالحًا', 'danger'); return; }
        if (!data || (data.kind !== 'qisma.settings' && data.kind !== 'qisma.session')) {
          UI.toast('هذا الملف ليس ملف إعدادات أو نسخة من قسمة', 'danger');
          return;
        }
        if (data.schemaVersion != null && data.schemaVersion > Store.SCHEMA) {
          UI.toast('هذا الملف من نسخة أحدث من التطبيق (' + data.schemaVersion + ' > ' + Store.SCHEMA + ') — لن يُقرأ لتجنّب فقدان بيانات', 'danger');
          return;
        }
        if (data.kind === 'qisma.settings') {
          var s = data.settings || {};
          if (s.tiers) state.tiers = s.tiers;
          if (s.pools) state.pools = s.pools;
          if (s.options) state.options = s.options;
          if (s.ui) state.ui = s.ui;
          if (s.periodDays) state.periodDays = s.periodDays;
          Theme.set(state.ui.theme || 'system');
          recompute();
          render('all');
          UI.toast('تم استيراد الإعدادات', 'ok');
        } else {
          var ss = data.session || {};
          ['title', 'period', 'periodDays', 'headers', 'rawRows', 'mapping', 'people', 'fileName', 'tiers', 'pools', 'options'].forEach(function (k) {
            if (ss[k] != null) state[k] = ss[k];
          });
          state.undoStack = []; state.redoStack = [];
          recompute();
          state.screen = state.people.length ? 'allocate' : 'upload';
          render('all');
          UI.toast('تم استيراد النسخة الكاملة — ' + Fmt.int(state.people.length) + ' شخص', 'ok');
        }
      };
      reader.readAsText(f);
    });
    inp.click();
  }

  function customExportDefs(state, result) {
    var exec = Reports.executiveRows(state, result);
    var unresolvedCount = exec.__totals.unresolved;
    var specials = Reports.specialRows(state, result);
    var warns = Reports.warningRows(result);
    var defs = [
      { key: 'exec', label: 'الملخص التنفيذي', hint: 'أهم الأرقام في صفحة واحدة' },
      { key: 'pools', label: 'المجمعات', hint: 'ملخص كل مجمع: الإجمالي والصافي وعدد الأعضاء' },
      { key: 'detail', label: 'التفصيل الكامل', hint: Fmt.int((state.people || []).length) + ' شخص بكل الأعمدة' },
      { key: 'dept', label: 'حسب القسم', hint: 'مجموع لكل قسم' },
      { key: 'tier', label: 'حسب الفئة', hint: 'مجموع لكل فئة' },
      { key: 'methodology', label: 'المنهجية', hint: 'شرح طريقة الحساب والتقريب' }
    ];
    if (unresolvedCount > 0) defs.push({ key: 'unresolved', label: 'بدون فئة', hint: Fmt.int(unresolvedCount) + ' شخص خارج التوزيع' });
    if (specials.length > 0) defs.push({ key: 'special', label: 'الحالات الخاصة', hint: Fmt.int(specials.length) + ' حالة' });
    if (warns.length > 0) defs.push({ key: 'warnings', label: 'التنبيهات', hint: Fmt.int(warns.length) + ' تنبيه' });
    Reports.poolRows(state, result).forEach(function (p) {
      if (p.members > 0) defs.push({ key: 'pool:' + p.name, label: p.name, hint: Fmt.int(p.members) + ' مستحق — ورقة مستقلة لهذا المجمع', group: 'pool' });
    });
    return defs;
  }

  function openCustomExportModal() {

      { v: 'single', label: 'ملف واحد بكل الأوراق المختارة', hint: 'أسرع وأسهل في المشاركة — ملف Excel واحد بكل الأوراق كصفحات منفصلة' },
      { v: 'perFile', label: 'ملف Excel منفصل لكل ورقة', hint: 'تنزيل عدة ملفات دفعة واحدة، كل ورقة في ملفها الخاص' }
    ].forEach(function (o) {
      var row = el('label', 'check');
      var r = el('input');
      r.type = 'radio';
      r.name = 'export-mode';
      r.checked = fileMode === o.v;
      r.addEventListener('change', function () { if (r.checked) fileMode = o.v; });
      var box = el('span', 'check-box');
      box.style.borderRadius = '50%';
      box.appendChild(Icons.svg('check'));
      row.appendChild(r);
      row.appendChild(box);
      var txt = el('div', 'stack');
      txt.appendChild(el('span', null, o.label));
      txt.appendChild(el('span', 'field-help', o.hint));
      row.appendChild(txt);
      modeList.appendChild(row);
    });
    m.body.appendChild(modeList);

    var summary = el('div', 'notice notice-accent');
    summary.setAttribute('aria-live', 'polite');

    summary.appendChild(Icons.svg('info', 'notice-icon'));
    summary.appendChild(el('div', 'notice-body', summaryText));
    m.body.appendChild(summary);

    var exportBtn;
    function refresh() {
      var count = Object.keys(selected).filter(function (k) { return selected[k]; }).length;
      clearNode(summaryText);
      summaryText.appendChild(document.createTextNode(
        count === 0 ? 'اختر ورقة واحدة على الأقل' : Fmt.int(count) + ' ورقة مختارة'
      ));
      if (exportBtn) exportBtn.disabled = count === 0;
    }

    exportBtn = btn('تصدير', {
      variant: 'primary', icon: 'download',
      onClick: function () {
        var keys = Object.keys(selected).filter(function (k) { return selected[k]; });
        if (keys.length === 0) return;
        var stamp = Fmt.isoDate(Date.now());
        var base = (state.title || APP_NAME) + ' - ' + stamp;
        var meta = { at: Date.now(), version: APP_VERSION };
        try {
          if (fileMode === 'single') {
            var wb = Exporter.buildSelectedReport(state, state.result, meta, keys);
            if (!wb.SheetNames || wb.SheetNames.length === 0) { UI.toast('لا توجد بيانات في الأوراق المختارة', 'warn'); return; }
            Exporter.write(wb, base + '.xlsx');
          } else {
            var written = 0;
            keys.forEach(function (key, i) {
              setTimeout(function () {
                var wbOne = Exporter.buildSelectedReport(state, state.result, meta, [key]);
                if (!wbOne.SheetNames || wbOne.SheetNames.length === 0) return;
                var label = defs.find(function (d) { return d.key === key; });
                Exporter.write(wbOne, base + ' - ' + (label ? label.label : key) + '.xlsx');

            });
          }
          m.close();
          UI.toast('تم تنزيل ' + Fmt.int(keys.length) + ' ورقة', 'ok');
        } catch (e) {
          UI.toast('تعذّر إنشاء الملف: ' + (e && e.message ? e.message : 'خطأ غير معروف'), 'danger');
        }
      }
    });
    m.foot.appendChild(btn('إلغاء', { variant: 'ghost', onClick: m.close }));
    m.foot.appendChild(exportBtn);
    refresh();
    return m;
  }

  var SETTINGS_PANES = [
    { key: 'tiers', label: 'الفئات', icon: 'layers' },
    { key: 'pools', label: 'المجمعات', icon: 'coins' },
    { key: 'calc', label: 'الحساب', icon: 'sliders' },
    { key: 'display', label: 'العرض', icon: 'eye' },
    { key: 'data', label: 'البيانات', icon: 'save' }
  ];

  function openSettings(startPane) {
    var current = startPane || 'tiers';
    var m = UI.modal({ title: 'الإعدادات', subtitle: 'كل تغيير يُحفظ تلقائيًا ويُعاد الحساب فورًا', wide: true, footer: false });
    m.body.style.padding = '0';
    var shell = el('div', 'settings-shell');
    var rail = el('div', 'settings-rail');
    var pane = el('div', 'settings-pane');
    shell.appendChild(rail);
    shell.appendChild(pane);
    m.body.appendChild(shell);

    function paint() {
      clearNode(rail);
      SETTINGS_PANES.forEach(function (p) {
        var b = el('button', 'rail-btn');
        b.type = 'button';
        if (p.key === current) b.setAttribute('aria-current', 'true');
        b.appendChild(Icons.svg(p.icon));
        b.appendChild(el('span', null, p.label));
        b.addEventListener('click', function () { current = p.key; paint(); });
        rail.appendChild(b);
      });
      clearNode(pane);
      if (current === 'tiers') paneTiers(pane);
      else if (current === 'pools') panePools(pane, m);
      else if (current === 'calc') paneCalc(pane);
      else if (current === 'display') paneDisplay(pane);
      else paneData(pane, m);
    }
    paint();
    return m;
  }

  function paneTiers(pane) {
    pane.appendChild(el('h3', 'pane-title', 'الفئات وقيمها'));
    pane.appendChild(el('p', 'pane-intro', 'الفئة هي القيمة الأساسية التي يُبنى عليها وزن الشخص. أي فئة في ملفك غير موجودة هنا تُخرج صاحبها من التوزيع بالكامل — ويظهر في ورقة «بدون فئة» في التقرير.'));

    var usage = Object.create(null);
    state.people.forEach(function (p) { if (p.tier) usage[p.tier] = (usage[p.tier] || 0) + 1; });
    var defined = Object.keys(state.tiers);
    var unknown = Object.keys(usage).filter(function (t) { return defined.indexOf(t) === -1; });

    if (unknown.length) {
      pane.appendChild(UI.notice({
        tone: 'danger', title: Fmt.int(unknown.length) + ' فئة في الملف غير معرّفة هنا',
        text: unknown.map(function (t) { return t + ' (' + Fmt.int(usage[t]) + ')'; }).join('، '),
        actions: unknown.map(function (t) {
          return btn('أضف "' + t + '"', {
            size: 'sm', onClick: function () {
              state.tiers[t] = 1000;
              recompute();
              clearNode(pane);
              paneTiers(pane);
              renderScreenIfMounted();
            }
          });
        })
      }));
    }

    var list = el('div', 'stack');
    list.style.marginTop = 'var(--s4)';
    defined.forEach(function (name) {
      var row = el('div', 'setting-row wide');
      var left = el('div');
      var nameIn = UI.input({
        value: name, size: 'sm', ariaLabel: 'اسم الفئة',
        onChange: function (v) { renameTier(name, v, pane); }
      });
      left.appendChild(nameIn);
      var used = usage[name] || 0;
      left.appendChild(el('div', 'setting-desc', used ? Fmt.int(used) + ' شخص في هذه الفئة' : 'غير مستخدمة في الملف الحالي'));
      row.appendChild(left);
      var right = el('div', 'row g2');
      var valIn = UI.input({
        value: state.tiers[name], size: 'sm', numeric: true, type: 'number', min: 0, step: '0.01', ariaLabel: 'قيمة ' + name,
        onInput: function (v) {
          var n = Fmt.parseNumber(v);
          state.tiers[name] = n == null ? 0 : n;
          recompute();
          renderScreenIfMounted();
        }
      });
      right.appendChild(valIn);
      right.appendChild(UI.iconBtn('trash', 'حذف الفئة', function () { removeTier(name, pane); }, 'sm'));
      row.appendChild(right);
      list.appendChild(row);
    });
    pane.appendChild(list);
    pane.appendChild(btn('فئة جديدة', {
      icon: 'plus', onClick: function () {
        var base = 'فئة جديدة', n = base, i = 2;
        while (state.tiers[n]) { n = base + ' ' + i; i++; }
        state.tiers[n] = 1000;
        recompute();
        clearNode(pane);
        paneTiers(pane);
        renderScreenIfMounted();
      }
    }));
  }

  function renameTier(oldName, newName, pane) {
    var t = String(newName || '').trim();
    if (!t || t === oldName) { clearNode(pane); paneTiers(pane); return; }
    if (state.tiers[t]) {
      UI.toast('يوجد فئة بنفس الاسم', 'warn');
      clearNode(pane); paneTiers(pane);
      return;
    }
    var rebuilt = {};
    Object.keys(state.tiers).forEach(function (k) { rebuilt[k === oldName ? t : k] = state.tiers[k]; });
    state.tiers = rebuilt;
    state.people.forEach(function (p) { if (p.tier === oldName) p.tier = t; });
    if (state.filters.tier === oldName) state.filters.tier = t;
    recompute();
    clearNode(pane);
    paneTiers(pane);
    renderScreenIfMounted();
  }

  function removeTier(name, pane) {
    var affected = state.people.filter(function (p) { return p.tier === name; }).length;
    UI.confirmModal({
      title: 'حذف فئة "' + name + '"؟',
      tone: affected ? 'danger' : 'warn',
      message: affected
        ? Fmt.int(affected) + ' شخص في هذه الفئة سيخرجون من التوزيع تمامًا ولن يحصلوا على أي مبلغ، وسيظهرون في ورقة «بدون فئة».'
        : 'الفئة غير مستخدمة في الملف الحالي.',
      confirmLabel: 'حذف', danger: true,
      onConfirm: function () {
        delete state.tiers[name];
        recompute();
        clearNode(pane);
        paneTiers(pane);
        renderScreenIfMounted();
        UI.toast('تم حذف الفئة', 'ok');
      }
    });
  }

  function panePools(pane, m) {
    pane.appendChild(el('h3', 'pane-title', 'المجمعات'));
    pane.appendChild(el('p', 'pane-intro', 'كل مجمع مصدر مبلغ منفصل بنسبة خصم خاصة به. التوزيع يوازن الأوزان بين المجمعات تلقائيًا، إلا من قفلته يدويًا على مجمع محدد.'));
    var list = el('div', 'stack');
    Object.keys(state.pools).forEach(function (name) {
      var p = state.pools[name];
      var pinned = state.people.filter(function (x) { return x.pinnedPool === name; }).length;
      var row = el('div', 'setting-row wide');
      var left = el('div');
      left.appendChild(el('div', 'setting-name', name));
      left.appendChild(el('div', 'setting-desc',
        'إجمالي ' + Fmt.egp(p.gross) + ' · خصم ' + Fmt.pctExact(p.taxRate) + ' · صافي ' + Fmt.egp(p.gross * (1 - p.taxRate)) +
        (pinned ? ' · ' + Fmt.int(pinned) + ' مقفول' : '')));
      row.appendChild(left);
      row.appendChild(btn('تعديل', {
        size: 'sm', onClick: function () { if (m) m.close(); goto('amounts'); }
      }));
      list.appendChild(row);
    });
    pane.appendChild(list);
    pane.appendChild(UI.notice({
      tone: 'accent',
      text: 'تعديل المبالغ وإضافة المجمعات يحدث في شاشة «المبالغ» حيث ترى أثر كل رقم فورًا.',
      actions: [btn('اذهب إلى المبالغ', { size: 'sm', variant: 'primary', onClick: function () { if (m) m.close(); goto('amounts'); } })]
    }));
  }

  function paneCalc(pane) {
    pane.appendChild(el('h3', 'pane-title', 'إعدادات الحساب'));
    pane.appendChild(el('p', 'pane-intro', 'هذه الإعدادات تؤثر على كل رقم في التطبيق. كل الحساب يجري بالقرش الصحيح، ووحدة التقريب تحدد أصغر فرق ممكن بين نصيبين.'));

    var r1 = el('div', 'setting-row');
    var l1 = el('div');
    l1.appendChild(el('div', 'setting-name', 'عدد أيام الفترة'));
    l1.appendChild(el('div', 'setting-desc', 'من عمل أيامًا أقل يأخذ نسبة من وزنه الكامل'));
    r1.appendChild(l1);
    r1.appendChild(UI.input({
      value: state.periodDays, size: 'sm', numeric: true, type: 'number', min: 1, step: '1', ariaLabel: 'أيام الفترة',
      onInput: function (v) {
        var n = Fmt.parseNumber(v);
        state.periodDays = (n == null || n < 1) ? 1 : Math.round(n);
        recompute();
        renderScreenIfMounted();
      }
    }));
    pane.appendChild(r1);

    var r2 = el('div', 'setting-row wide');
    var l2 = el('div');
    l2.appendChild(el('div', 'setting-name', 'وحدة التقريب'));
    l2.appendChild(el('div', 'setting-desc', 'إجمالي كل مجمع يُعدَّل ليكون من مضاعفات هذه الوحدة، ويظهر التعديل في التقرير'));
    r2.appendChild(l2);
    var rdd = UI.dropdown({
      options: [
        { value: '1', label: 'قرش واحد' }, { value: '5', label: '5 قروش' },
        { value: '25', label: '25 قرشًا' }, { value: '50', label: '50 قرشًا' }, { value: '100', label: 'جنيه صحيح' }
      ],
      value: String(state.options.roundingStep), size: 'sm', align: 'end',
      onChange: function (v) { state.options.roundingStep = Number(v); recompute(); renderScreenIfMounted(); }
    });
    r2.appendChild(rdd);
    pane.appendChild(r2);

    pane.appendChild(UI.notice({
      tone: 'accent', title: 'كيف تُوزَّع البواقي',
      text: 'بعد إعطاء كل شخص نصيبه الصحيح بالقرش، تُوزَّع القروش الباقية على الأكبر باقيًا، ثم الأكبر وزنًا، ثم الأصغر رقم صف. نفس المدخلات تعطي نفس النتيجة دائمًا، ومجموع الأنصبة يساوي الإجمالي بالقرش بلا فرق.'
    }));
  }

  function paneDisplay(pane) {
    pane.appendChild(el('h3', 'pane-title', 'العرض'));
    pane.appendChild(el('p', 'pane-intro', 'إعدادات مظهر الجداول. لا تؤثر على أي حساب أو تصدير.'));

    var r0 = el('div', 'setting-row wide');
    var l0 = el('div');
    l0.appendChild(el('div', 'setting-name', 'المظهر'));
    l0.appendChild(el('div', 'setting-desc', 'فاتح أو داكن أو حسب إعداد النظام'));
    r0.appendChild(l0);
    r0.appendChild(UI.dropdown({
      options: [{ value: 'system', label: 'حسب النظام' }, { value: 'light', label: 'فاتح' }, { value: 'dark', label: 'داكن' }],
      value: Theme.get(), size: 'sm', align: 'end',
      onChange: function (v) { state.ui.theme = v; Theme.set(v); scheduleSave(); paintThemeBtn(); }
    }));
    pane.appendChild(r0);

    var r1 = el('div', 'setting-row wide');
    var l1 = el('div');
    l1.appendChild(el('div', 'setting-name', 'كثافة الجدول'));
    l1.appendChild(el('div', 'setting-desc', 'المضغوط يعرض صفوفًا أكثر في نفس المساحة'));
    r1.appendChild(l1);
    r1.appendChild(UI.dropdown({
      options: [{ value: 'normal', label: 'عادي' }, { value: 'compact', label: 'مضغوط' }],
      value: state.ui.density, size: 'sm', align: 'end',
      onChange: function (v) { state.ui.density = v; scheduleSave(); renderScreenIfMounted(); }
    }));
    pane.appendChild(r1);

    var r2 = el('div', 'setting-row wide');
    var l2 = el('div');
    l2.appendChild(el('div', 'setting-name', 'صفوف في الصفحة'));
    l2.appendChild(el('div', 'setting-desc', 'عدد أكبر يعني تمريرًا أطول وترقيمًا أقل'));
    r2.appendChild(l2);
    r2.appendChild(UI.dropdown({
      options: [{ value: '50', label: '50' }, { value: '100', label: '100' }, { value: '250', label: '250' }, { value: '500', label: '500' }],
      value: String(state.ui.rowsPerPage), size: 'sm', align: 'end',
      onChange: function (v) { state.ui.rowsPerPage = Number(v); scheduleSave(); renderScreenIfMounted(); }
    }));
    pane.appendChild(r2);
  }

  function paneData(pane, m) {
    pane.appendChild(el('h3', 'pane-title', 'البيانات والحفظ'));
    var u = Store.usage();
    pane.appendChild(el('p', 'pane-intro',
      u.available
        ? 'التطبيق يحفظ عملك تلقائيًا في هذا المتصفح فقط. لا شيء يُرسل لأي سيرفر. الحجم المستخدم حاليًا ' + Fmt.int(Math.round(u.total / 1024)) + ' كيلوبايت.'
        : 'الحفظ التلقائي غير متاح: ' + u.reason + '. نزّل نسخة يدويًا للاحتفاظ بعملك.'));

    var rows = [
      { name: 'تنزيل نسخة كاملة', desc: 'الملف والتعديلات والإعدادات في ملف JSON واحد', action: btn('تنزيل', { icon: 'save', size: 'sm', onClick: exportSessionBundle }) },
      { name: 'تنزيل الإعدادات فقط', desc: 'الفئات والمجمعات بدون بيانات أشخاص', action: btn('تنزيل', { icon: 'download', size: 'sm', onClick: exportSettingsBundle }) },
      { name: 'استيراد ملف', desc: 'يقبل نسخة كاملة أو ملف إعدادات — ويرفض أي ملف من نسخة أحدث', action: btn('استيراد', { icon: 'folder', size: 'sm', onClick: importSettingsBundle }) }
    ];
    rows.forEach(function (r) {
      var row = el('div', 'setting-row wide');
      var left = el('div');
      left.appendChild(el('div', 'setting-name', r.name));
      left.appendChild(el('div', 'setting-desc', r.desc));
      row.appendChild(left);
      row.appendChild(r.action);
      pane.appendChild(row);
    });

    var dangerRow = el('div', 'setting-row wide');
    var dl = el('div');
    dl.appendChild(el('div', 'setting-name', 'مسح كل المحفوظ'));
    dl.appendChild(el('div', 'setting-desc', 'يحذف الجلسة والإعدادات من هذا المتصفح ويعيد التطبيق لحالته الأولى'));
    dangerRow.appendChild(dl);
    dangerRow.appendChild(btn('مسح الكل', {
      variant: 'danger', size: 'sm', onClick: function () {
        UI.confirmModal({
          title: 'مسح كل البيانات المحفوظة؟',
          tone: 'danger', danger: true, confirmLabel: 'مسح الكل',
          message: 'سيُحذف الملف الحالي وكل التعديلات والفئات والمجمعات المخصصة من هذا المتصفح. لا يمكن الرجوع. نزّل نسخة أولًا إن كنت تحتاج عملك.',
          onConfirm: function () {
            Store.clearAll();
            if (m) m.close();
            state = makeState();
            render('all');
            UI.toast('تم مسح كل البيانات المحفوظة', 'ok');
          }
        });
      }
    }));
    pane.appendChild(dangerRow);

    pane.appendChild(UI.notice({
      tone: 'accent', title: 'خصوصية',
      text: 'قسمة يعمل بالكامل داخل متصفحك. ملفاتك لا تُرفع لأي مكان، ولا يوجد أي اتصال بأي سيرفر بعد تحميل الصفحة.'
    }));
  }

  function renderScreenIfMounted() {
    if (hosts.screen) renderScreen();
    if (hosts.stepper) renderStepper();
  }

  document.addEventListener('keydown', function (e) {
    if (!state) return;
    var mod = e.ctrlKey || e.metaKey;
    if (mod && e.key.toLowerCase() === 'z' && !e.shiftKey) { e.preventDefault(); undo(); return; }
    if (mod && (e.key.toLowerCase() === 'y' || (e.shiftKey && e.key.toLowerCase() === 'z'))) { e.preventDefault(); redo(); return; }
    if (mod && e.key.toLowerCase() === 'k') {
      e.preventDefault();
      var s = document.getElementById('dash-search') || document.getElementById('grid-search');
      if (s) { s.focus(); s.select(); }
      return;
    }
    if (mod && e.key.toLowerCase() === 's') { e.preventDefault(); exportSessionBundle(); return; }
  });
  function boot(root) {
    hosts.root = root;
    state = makeState();
    autosaveArmed = true;
    var savedSettings = Store.load('settings');
    if (savedSettings && !savedSettings.__error) {
      if (savedSettings.tiers) state.tiers = savedSettings.tiers;
      if (savedSettings.pools) state.pools = savedSettings.pools;
      if (savedSettings.options) state.options = savedSettings.options;
      if (savedSettings.ui) state.ui = savedSettings.ui;
      if (savedSettings.periodDays) state.periodDays = savedSettings.periodDays;
    }
    Theme.init(state.ui.theme);
    var savedSession = Store.load('session');
    if (savedSession && !savedSession.__error && savedSession.people && savedSession.people.length) {
      state.__restore = savedSession;
    }
    var printPrevDetail;
    window.addEventListener('beforeprint', function () {
      printPrevDetail = state.ui.tableDetail;
      if (state.ui.tableDetail === 'full') {
        state.ui.tableDetail = 'simple';
        renderTable();
      }
    });
    window.addEventListener('afterprint', function () {
      if (printPrevDetail !== undefined && printPrevDetail !== state.ui.tableDetail) {
        state.ui.tableDetail = printPrevDetail;
        renderTable();
      }
      printPrevDetail = undefined;
    });
    render('all');
  }

  function restoreSession() {
    var s = state.__restore;
    if (!s) return;
    state.__restore = null;
    ['title', 'period', 'periodDays', 'headers', 'rawRows', 'mapping', 'people', 'fileName', 'tiers', 'pools', 'options'].forEach(function (k) {
      if (s[k] != null) state[k] = s[k];
    });
    recompute();
    state.screen = s.screen && s.people.length ? s.screen : 'allocate';
    render('all');
    UI.toast('تمت استعادة الجلسة المحفوظة', 'ok');
  }

  return {
    boot: boot,
    version: APP_VERSION,
    internals: {
      getState: function () { return state; },
      setState: function (s) { state = s; },
      recompute: recompute,
      viewRows: viewRows,
      rowsCache: rowsCache,
      searchIndex: searchIndex,
      resultIndex: resultIndex,
      filterSummaryText: filterSummaryText,
      makeState: makeState,
      COLUMNS: COLUMNS,
      FLAGS: FLAGS
    }
  };
})();
</script>
<script>
var SelfTest = (function () {
  'use strict';

  var results = [];
  function record(name, pass, detail) { results.push({ name: name, pass: !!pass, detail: detail || '' }); }
  function approx(a, b, eps) { return Math.abs(a - b) <= (eps == null ? 1e-6 : eps); }

  function rng(seed) {
    var s = seed;
    return function () { s = (s * 1103515245 + 12345) & 0x7fffffff; return s / 0x7fffffff; };
  }

  var TIERS = { 'فئة أ': 3000, 'فئة ب': 2200, 'فئة ج': 1600, 'فئة د': 1100 };
  function pools(a, b) {
    return { 'الخدمة': { gross: a == null ? 120000 : a, taxRate: 0.05 }, 'التوصيل': { gross: b == null ? 45000 : b, taxRate: 0.10 } };
  }
  function onePool(gross, taxRate) {
    return { 'واحد': { gross: gross == null ? 60000 : gross, taxRate: taxRate == null ? 0.05 : taxRate } };
  }
  function onlyEmptyPoolRefusal(res) {
    return !res.ok && (res.errors || []).every(function (e) {
      return e.code === 'EMPTY_POOL_WITH_BUDGET' || e.code === 'NO_ELIGIBLE_PEOPLE';
    });
  }
  function person(id, extra) {
    var p = { id: id, name: 'شخص ' + id, job: '', dept: 'قسم', tier: 'فئة أ', daysWorked: null, penaltyRate: null, manualFactor: null, overrideValue: null, pinnedPool: null, excluded: false, notes: '' };
    if (extra) Object.keys(extra).forEach(function (k) { p[k] = extra[k]; });
    return p;
  }
  function baseState(people, opts) {
    return {
      people: people, tiers: TIERS, pools: (opts && opts.pools) || pools(),
      periodDays: (opts && opts.periodDays) || 30,
      options: { roundingStep: (opts && opts.roundingStep) || 1 },
      title: 'اختبار', period: 'فترة',
      filters: { q: '', dept: '', tier: '', pool: '', flags: [] },
      sort: { key: null, dir: null }, ui: { rowsPerPage: 100, density: 'normal' },
      page: { dashboard: 1, allocate: 1, grid: 1 }
    };
  }
  function sumGross(res, pool) {
    return res.people.filter(function (p) { return p.pool === pool; })
      .reduce(function (s, p) { return s + p.grossPiastres; }, 0);
  }

  function run() {
    results = [];

    (function T1() {
      var r = rng(42), ok = true, detail = '', n = 0, skipped = 0;
      for (var s = 0; s < 200; s++) {
        var count = 3 + Math.floor(r() * 25), people = [];
        for (var i = 0; i < count; i++) {
          people.push(person(i + 1, { tier: Object.keys(TIERS)[Math.floor(r() * 4)] }));
        }
        var g1 = Math.round(r() * 400000) / 100 + 0.37;
        var g2 = Math.round(r() * 200000) / 100 + 0.91;
        var res = Engine.runPipeline(baseState(people, { pools: pools(g1, g2) }));
        if (onlyEmptyPoolRefusal(res)) { skipped++; continue; }
        if (!res.ok) { ok = false; detail = 'فشل: ' + JSON.stringify(res.errors); break; }
        n++;
        if (sumGross(res, 'الخدمة') !== Engine.toPiastres(g1) || sumGross(res, 'التوصيل') !== Engine.toPiastres(g2)) {
          ok = false; detail = 'سيناريو ' + s + ': مجموع الأنصبة لا يساوي الإجمالي'; break;
        }
      }
      record('T1 — حفظ القيمة عبر 200 سيناريو عشوائي', ok && n > 0, ok ? (n + ' سيناريو مطابق بالقرش، ' + skipped + ' رُفض بشكل صحيح لمجمع بلا أعضاء') : detail);
    })();

    (function T2() {
      var people = [person(1), person(2, { tier: 'فئة د' })];
      var res = Engine.runPipeline(baseState(people, { pools: { 'واحد': { gross: 10000, taxRate: 0 } } }));
      var a = res.people[0], b = res.people[1];
      var ratio = a.netPiastres / b.netPiastres;
      var expected = TIERS['فئة أ'] / TIERS['فئة د'];
      record('T2 — التناسب داخل المجمع', res.ok && approx(ratio, expected, 0.01), 'النسبة ' + ratio.toFixed(4) + ' والمتوقع ' + expected.toFixed(4));
    })();

    (function T3() {
      var people = [person(1, { pinnedPool: 'الخدمة' }), person(2, { pinnedPool: 'التوصيل' })];
      var res = Engine.runPipeline(baseState(people, { pools: { 'الخدمة': { gross: 10000, taxRate: 0 }, 'التوصيل': { gross: 10000, taxRate: 0 } } }));
      record('T3 — العدالة بين المجمعات عند تساوي الأوزان', res.ok && res.people[0].netPiastres === res.people[1].netPiastres,
        'صافي ' + res.people[0].netPiastres + ' مقابل ' + res.people[1].netPiastres);
    })();

    (function T4() {
      var res = Engine.runPipeline(baseState([person(1), person(2), person(3)], { pools: { 'واحد': { gross: 1000, taxRate: 0.1 } } }));
      var gross = res.people.reduce(function (s, p) { return s + p.grossPiastres; }, 0);
      var tax = res.people.reduce(function (s, p) { return s + p.taxPiastres; }, 0);
      var net = res.people.reduce(function (s, p) { return s + p.netPiastres; }, 0);
      record('T4 — الإجمالي = الخصم + الصافي', res.ok && gross === 100000 && gross === tax + net,
        'إجمالي ' + gross + ' خصم ' + tax + ' صافي ' + net);
    })();

      var b = Exporter.sanitizeSheetName('نفس الاسم', used);
      var clean = !/[\\\/\?\*\[\]:]/.test(name) && name.length <= 31;
      record('T36 — أسماء الأوراق مُنقّاة وغير مكررة', clean && a !== b && b.length <= 31,
        'الطول ' + name.length + ' والتكرار "' + a + '" مقابل "' + b + '"');
    })();

    (function T37() {
      var st = baseState([person(1), person(2, { tier: 'مجهولة' })], { pools: onePool() });
      var res = Engine.runPipeline(st);
      var check = Reports.conservationCheck(st, res);
      record('T37 — فحص حفظ القيمة يمر على كل مجمع', res.ok && check.ok,
        check.ok ? 'كل المجمعات مطابقة' : JSON.stringify(check.problems));
    })();

    (function T34() {
      if (!App || !App.internals) { record('T34 — الحالات الخاصة لا تتأثر بالفلاتر', false, 'App.internals غير متاح'); return; }
      var api = App.internals;
      var saved = api.getState();
      var people = [];
      for (var i = 0; i < 24; i++) {
        people.push(person(i + 1, {
          dept: ['أ', 'ب'][i % 2],
          excluded: i % 7 === 0,
          penaltyRate: i % 5 === 0 ? 0.2 : null
        }));
      }
      var probe = baseState(people);
      api.setState(probe);
      api.recompute();
      var wide = Reports.specialRows(probe, probe.result).length;
      probe.filters.dept = 'ب';
      probe.filters.q = 'شخص 3';
      var narrow = Reports.specialRows(probe, probe.result).length;
      var viewNarrowed = api.viewRows().length < people.length;
      api.setState(saved);
      record('T34 — اختيار الحالات الخاصة يُحسب من كل السكان', wide === narrow && wide > 0 && viewNarrowed,
        'بدون فلتر ' + wide + ' ومع فلتر ' + narrow + ' (العرض تقلّص=' + viewNarrowed + ')');
    })();

    (function T35() {
      var people = [person(1, { tier: 'مجهولة' }), person(2), person(3)];
      var st = baseState(people, { pools: { 'واحد': { gross: 9999.99, taxRate: 0.07 } }, roundingStep: 100 });
      var res = Engine.runPipeline(st);
      if (!res.ok) { record('T35 — التكامل: بدون فئة + تقريب + خصم معًا', false, JSON.stringify(res.errors)); return; }
      var expected = Engine.effectiveGrossPiastres(9999.99, 100);
      var actual = sumGross(res, 'واحد');
      var orphanZero = res.people.filter(function (p) { return p.id === 1; })[0].netPiastres === 0;
      var rounded = (res.warnings || []).some(function (w) { return w.code === 'POOL_ROUNDED'; });
      var orphanWarned = (res.warnings || []).some(function (w) { return w.code === 'UNRESOLVED_TIER'; });
      record('T35 — التكامل: بدون فئة + تقريب لأقرب جنيه + خصم معًا',
        actual === expected && orphanZero && rounded && orphanWarned,
        'الإجمالي ' + actual + '/' + expected + ' والمستبعد صفر=' + orphanZero + ' وتنبيه التقريب=' + rounded);
    })();

    return results;
  }

  function renderInto(root) {
    var list = run();
    var passed = list.filter(function (r) { return r.pass; }).length;
    var ok = passed === list.length;

    var shell = UI.el('div', 'shell');
    shell.style.paddingTop = 'var(--s6)';

    var head = UI.el('div', 'page-head');
    head.appendChild(UI.el('h1', 'page-title', 'اختبارات قِسمة الذاتية'));
    head.appendChild(UI.el('p', 'page-sub', 'تعمل كلها داخل المتصفح على محرك الحساب الحقيقي — بلا أي اتصال خارجي.'));
    shell.appendChild(head);

    var summary = UI.el('div', 'kpi-row');
    summary.appendChild((function () {
      var c = UI.el('div', 'kpi ' + (ok ? 'kpi-ok' : 'kpi-danger'));
      c.appendChild(UI.el('div', 'kpi-label', 'النتيجة'));
      var v = UI.el('div', 'kpi-value');
      v.appendChild(UI.el('span', 'money money-xl', UI.el('span', 'money-int', passed + ' / ' + list.length)));
      c.appendChild(v);
      c.appendChild(UI.el('div', 'kpi-foot', ok ? 'كل الاختبارات ناجحة' : (list.length - passed) + ' اختبار فاشل'));
      return c;
    })());
    summary.appendChild((function () {
      var c = UI.el('div', 'kpi kpi-flat');
      c.appendChild(UI.el('div', 'kpi-label', 'الإصدار'));
      var v = UI.el('div', 'kpi-value');
      v.appendChild(UI.el('span', 'money money-lg', UI.el('span', 'money-int', APP_VERSION)));
      c.appendChild(v);
      c.appendChild(UI.el('div', 'kpi-foot', APP_NAME + ' ' + APP_NAME_LATIN));
      return c;
    })());
    shell.appendChild(summary);

    var card = UI.el('div', 'card');
    card.style.marginTop = 'var(--s5)';
    var tw = UI.el('div', 'table-wrap');
    var t = UI.el('table', 'dt');
    var thead = UI.el('thead');
    var htr = UI.el('tr');
    ['', 'الاختبار', 'التفصيل'].forEach(function (h) { htr.appendChild(UI.el('th', null, h)); });
    thead.appendChild(htr);
    t.appendChild(thead);
    var tb = UI.el('tbody');
    list.forEach(function (r) {
      var tr = UI.el('tr');
      var st = UI.el('td');
      st.appendChild(UI.badge(r.pass ? 'نجح' : 'فشل', r.pass ? 'ok' : 'danger', r.pass ? 'ok' : 'danger'));
      tr.appendChild(st);
      tr.appendChild(UI.el('td', null, r.name));
      var d = UI.el('td', 'small muted');
      d.style.direction = 'ltr';
      d.style.textAlign = 'right';
      d.appendChild(document.createTextNode(r.detail));
      tr.appendChild(d);
      tb.appendChild(tr);
    });
    t.appendChild(tb);
    tw.appendChild(t);
    card.appendChild(tw);
    shell.appendChild(card);

    var back = UI.el('div');
    back.style.marginTop = 'var(--s5)';
    back.appendChild(UI.btn('العودة للتطبيق', {
      variant: 'primary', onClick: function () { window.location.search = ''; }
    }));
    shell.appendChild(back);

    UI.clear(root);
    root.appendChild(shell);
  }

  return { run: run, renderInto: renderInto };
})();
</script>
<script>
(function () {
  'use strict';

  function updateShadowClasses(tw) {
    var maxScroll = tw.scrollWidth - tw.clientWidth;
    if (maxScroll <= 1) {
      tw.classList.remove('can-scroll-start', 'can-scroll-end');
      return;
    }
    var pos = Math.abs(tw.scrollLeft);
    tw.classList.toggle('can-scroll-start', pos > 2);
    tw.classList.toggle('can-scroll-end', pos < maxScroll - 2);
  }

  function enhance(tw) {
    if (tw.__scrollShadowBound) { updateShadowClasses(tw); return; }
    tw.__scrollShadowBound = true;
    var endEl = document.createElement('div');
    endEl.className = 'scroll-shadow scroll-shadow-end';
    endEl.setAttribute('aria-hidden', 'true');
    tw.appendChild(endEl);
    tw.addEventListener('scroll', function () { updateShadowClasses(tw); }, { passive: true });
    updateShadowClasses(tw);
  }

  function scan(root) {
    var wraps = (root || document).querySelectorAll('.table-wrap');
    for (var i = 0; i < wraps.length; i++) enhance(wraps[i]);
  }

  var pending = false;
  function scheduleScan() {
    if (pending) return;
    pending = true;
    requestAnimationFrame(function () { pending = false; scan(); });
  }

  var appRoot = document.getElementById('app');
  if (appRoot && typeof MutationObserver !== 'undefined') {
    var mo = new MutationObserver(scheduleScan);
    mo.observe(appRoot, { childList: true, subtree: true });
  }
  window.addEventListener('resize', function () {
    var wraps = document.querySelectorAll('.table-wrap');
    for (var i = 0; i < wraps.length; i++) updateShadowClasses(wraps[i]);
  }, { passive: true });

  scheduleScan();
})();
</script>
<script>
(function () {
  var root = document.getElementById('app');
  var params = new URLSearchParams(window.location.search);
  if (params.get('selftest') === '1') {
    SelfTest.renderInto(root);
  } else {
    App.boot(root);
  }
})();
</script>

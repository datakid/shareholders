<script>
(function(){try{
  var raw = localStorage.getItem('qisma.settings.v1');

  if (pref !== 'light' && pref !== 'dark') pref = 'system';
  var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme:dark)').matches);
  var r = document.documentElement;
  r.setAttribute('data-theme', dark ? 'dark' : 'light');
  r.setAttribute('data-theme-pref', pref);
}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>
<meta name="theme-color" content="#FAF9F5">
<style>
@font-face{font-family:'IBM Plex Sans Arabic';font-style:normal;font-weight:400 700;font-display:swap;src:local('IBM Plex Sans Arabic'),local('Noto Sans Arabic'),local('Segoe UI');}
:root{
color-scheme:light;
--paper:#F0EEE6; --surface:#FAF9F5; --surface-2:#F5F3EC; --surface-3:#EDEAE0;
--ink:#141413; --ink-2:#3D3D3A; --ink-3:#6B6B66; --ink-4:#9A9A93;
--line:#DEDBD1; --line-2:#CFCBBE; --line-3:#E8E5DB;
--accent:#D97757; --accent-ink:#B85C3E; --accent-wash:#FBEEE8; --accent-line:#EFCDBD;
--on-accent:#fff;
--accent-fill:#B85C3E; --accent-fill-hover:#A34F33;
--ok:#3F7A5C; --ok-wash:#EAF3EE; --ok-line:#C4DCCF;
--warn:#8A6220; --warn-wash:#FBF3E3; --warn-line:#EBD9B4;
--danger:#B4462F; --danger-wash:#FBEBE7; --danger-line:#EFC9BF;
--info:#3E6480; --info-wash:#ECF1F5; --info-line:#C6D6E1;
--glass:rgba(250,249,245,.82);
--scrim:rgba(20,20,19,.32);
--toast-bg:#141413; --toast-ink:#FAF9F5; --toast-hover:rgba(255,255,255,.12);
--toast-ok:#8FCBA8; --toast-warn:#E8C67B; --toast-danger:#EFA694;
--glow-1:rgba(217,119,87,.055); --glow-2:rgba(62,100,128,.038);
--s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px; --s7:48px; --s8:64px;
--t-xs:12px; --t-sm:13px; --t-md:14px; --t-lg:16px; --t-xl:20px; --t-2xl:25px; --t-3xl:31px;
--r1:6px; --r2:10px; --r3:14px; --r4:20px; --r-pill:999px;
--e1:0 1px 2px rgba(20,20,19,.05), 0 1px 1px rgba(20,20,19,.04);
--e2:0 2px 4px rgba(20,20,19,.05), 0 6px 16px -6px rgba(20,20,19,.10);
--e3:0 4px 8px rgba(20,20,19,.06), 0 18px 44px -12px rgba(20,20,19,.18);
--d1:90ms; --d2:150ms; --d3:220ms; --d4:340ms;
--ease:cubic-bezier(.2,.6,.2,1); --ease-out:cubic-bezier(.16,.84,.28,1);
--font:'IBM Plex Sans Arabic','Noto Sans Arabic','Segoe UI',system-ui,sans-serif;
--nav-h:64px;
}
@media screen{
[data-theme="dark"]{
color-scheme:dark;
--paper:#1A1A18; --surface:#232320; --surface-2:#2A2A26; --surface-3:#33322D;
--ink:#F5F3EE; --ink-2:#D6D3CA; --ink-3:#A6A29A; --ink-4:#7C7871;
--line:#3A3934; --line-2:#4A4842; --line-3:#302F2B;
--accent:#E08A6B; --accent-ink:#F0A183;
--accent-fill:#E08A6B; --accent-fill-hover:#EC9A7C; --on-accent:#201A16;
--accent-wash:#2E211B; --accent-line:#54382C;
--ok:#7FBF9A; --ok-wash:#1B2A22; --ok-line:#2F4A3A;
--warn:#DEB463; --warn-wash:#2B2418; --warn-line:#4C3E22;
--danger:#E88A72; --danger-wash:#2E1D19; --danger-line:#553229;
--info:#8FB4CE; --info-wash:#1A242B; --info-line:#334754;
--e1:0 1px 2px rgba(0,0,0,.40), 0 1px 1px rgba(0,0,0,.30);
--e2:0 2px 4px rgba(0,0,0,.40), 0 6px 16px -6px rgba(0,0,0,.55);
--e3:0 4px 8px rgba(0,0,0,.45), 0 18px 44px -12px rgba(0,0,0,.65);
--glass:rgba(35,35,32,.82); --scrim:rgba(0,0,0,.60);
--toast-bg:#2F2E2A; --toast-ink:#F5F3EE;
--glow-1:rgba(217,119,87,.07); --glow-2:rgba(62,100,128,.06);
}}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
background:var(--paper); color:var(--ink); font-family:var(--font);
font-size:var(--t-md); line-height:1.55; -webkit-font-smoothing:antialiased;
font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"lnum" 1;
}
body::before{
content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
background:
radial-gradient(1100px 620px at 88% -12%, var(--glow-1), transparent 70%),
radial-gradient(820px 520px at 4% 4%, var(--glow-2), transparent 68%);
}
#app{position:relative; z-index:1}
h1,h2,h3,h4{margin:0; font-weight:600; letter-spacing:-.011em; line-height:1.25}
p{margin:0}
button,input,select,textarea{font:inherit; color:inherit}
:focus{outline:none}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--r1)}
::selection{background:var(--accent-wash); color:var(--accent-ink)}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum" 1,"lnum" 1}

.shell{max-width:1320px; margin:0 auto; padding:0 var(--s5) var(--s8)}
.topbar{
position:sticky; top:0; z-index:60; height:var(--nav-h);
display:flex; align-items:center; gap:var(--s4);
padding:0 var(--s5); margin-bottom:var(--s5);
background:var(--glass); border-bottom:1px solid var(--line);
}
@supports (backdrop-filter:blur(1px)){.topbar{backdrop-filter:blur(14px) saturate(1.5)}}
@supports not (backdrop-filter:blur(1px)){.topbar{background:var(--surface)}}
.topbar-inner{max-width:1320px; margin:0 auto; width:100%; display:flex; align-items:center; gap:var(--s4)}
.brand{display:flex; align-items:center; gap:var(--s3); min-width:0}
.brand-mark{width:34px; height:34px; flex:none; display:block}
.brand-mark .wedge{transform-origin:16px 16px; transition:transform var(--d4) var(--ease-out)}
.brand-mark.lift .wedge{transform:translate(1.4px,-1.4px) rotate(-3deg)}
.brand-text{display:flex; flex-direction:column; min-width:0}
.brand-name{font-size:var(--t-lg); font-weight:600; letter-spacing:-.02em; line-height:1.1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.brand-name span{color:var(--ink-4); font-weight:400; font-size:var(--t-xs); margin-inline-start:6px; letter-spacing:0}
.brand-tag{font-size:var(--t-xs); color:var(--ink-3); line-height:1.2; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.topbar-spacer{flex:1 1 auto}
.topbar-actions{display:flex; align-items:center; gap:var(--s2)}
.topbar-link{
display:inline-flex; align-items:center; gap:5px; font-size:var(--t-xs); font-weight:600;
color:var(--ink-4); text-decoration:none; padding:6px 10px; border-radius:var(--r2);
transition:color var(--d2) var(--ease), background-color var(--d2) var(--ease);
}
.topbar-link:hover,.topbar-link:focus-visible{color:var(--accent); background:var(--surface-2)}
.topbar-link .icon-ext{width:11px; height:11px; transform:rotate(45deg); flex:none}

.stepper{display:flex; align-items:center; gap:var(--s1); padding:var(--s1); background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r-pill)}
.step-pill{
display:flex; align-items:center; gap:7px; padding:7px 14px; border:0; border-radius:var(--r-pill);
background:transparent; color:var(--ink-3); font-size:var(--t-sm); font-weight:500; cursor:pointer; white-space:nowrap;
transition:background var(--d2) var(--ease), color var(--d2) var(--ease);
}
.step-pill:hover:not(:disabled){background:var(--surface-3); color:var(--ink)}
.step-pill[aria-current="step"]{background:var(--surface); color:var(--ink); box-shadow:var(--e1)}
.step-pill:disabled{opacity:.42; cursor:not-allowed}
.step-dot{width:19px; height:19px; flex:none; border-radius:50%; display:grid; place-items:center; font-size:11px; font-weight:600; background:var(--surface-3); color:var(--ink-3)}
.step-dot svg{width:11px; height:11px}
.step-pill[aria-current="step"] .step-dot{background:var(--accent-fill); color:var(--on-accent)}
.step-pill.done .step-dot{background:var(--ok); color:var(--on-accent)}

.page-head{padding:var(--s5) 0 var(--s5)}
.page-title{font-size:var(--t-3xl); letter-spacing:-.025em}
.page-sub{margin-top:var(--s2); color:var(--ink-3); font-size:var(--t-lg); max-width:74ch; line-height:1.5}
.section-label{
display:inline-flex; flex-direction:column; gap:6px;
font-size:var(--t-xs); font-weight:600; color:var(--ink-3);
}
.section-label::after{content:''; width:24px; height:2px; background:var(--accent); border-radius:2px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); box-shadow:var(--e1)}
.card-pad{padding:var(--s5)}
.card-head{display:flex; align-items:flex-start; justify-content:space-between; gap:var(--s4); padding:var(--s4) var(--s5); border-bottom:1px solid var(--line-3)}
.card-title{font-size:var(--t-lg)}
.card-note{margin-top:2px; font-size:var(--t-sm); color:var(--ink-3)}
.grid{display:grid; gap:var(--s4)}
.stack{display:flex; flex-direction:column}
.row{display:flex; align-items:center}
.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.g2{gap:var(--s2)} .g3{gap:var(--s3)} .g4{gap:var(--s4)} .g5{gap:var(--s5)} .g6{gap:var(--s6)}
.muted{color:var(--ink-3)}
.tiny{font-size:var(--t-xs)}
.small{font-size:var(--t-sm)}
.divider{height:1px; background:var(--line-3); border:0; margin:var(--s4) 0}
.btn{
display:inline-flex; align-items:center; justify-content:center; gap:7px;
height:38px; padding:0 var(--s4); border-radius:var(--r2);
border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
font-size:var(--t-md); font-weight:500; cursor:pointer; white-space:nowrap;
transition:background var(--d2) var(--ease), border-color var(--d2) var(--ease), box-shadow var(--d2) var(--ease), transform var(--d1) var(--ease);
}
.btn:hover:not(:disabled){background:var(--surface-2); border-color:var(--ink-4)}
.btn:active:not(:disabled){transform:translateY(.5px)}
.btn:disabled{opacity:.45; cursor:not-allowed}
.btn svg{width:15px; height:15px; flex:none}
.btn-primary{background:var(--accent-fill); border-color:var(--accent-fill); color:var(--on-accent); box-shadow:var(--e1)}
.btn-primary:hover:not(:disabled){background:var(--accent-fill-hover); border-color:var(--accent-fill-hover)}
.btn-ghost{background:transparent; border-color:transparent; color:var(--ink-2)}
.btn-ghost:hover:not(:disabled){background:var(--surface-3); border-color:transparent}
.btn-danger{background:transparent; border-color:var(--danger-line); color:var(--danger)}
.btn-danger:hover:not(:disabled){background:var(--danger-wash); border-color:var(--danger)}
.btn-sm{height:31px; padding:0 var(--s3); font-size:var(--t-sm); border-radius:var(--r1)}
.btn-icon{width:34px; height:34px; padding:0; border-radius:var(--r2)}
.btn-icon.btn-sm{width:28px; height:28px}
.btn-block{width:100%}

.field{display:flex; flex-direction:column; gap:6px}
.field-label{font-size:var(--t-sm); font-weight:500; color:var(--ink-2)}
.field-help{font-size:var(--t-xs); color:var(--ink-3); line-height:1.45}
.input{
height:38px; width:100%; padding:0 var(--s3); border-radius:var(--r2);
border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
transition:border-color var(--d2) var(--ease), box-shadow var(--d2) var(--ease);
}
.input:hover:not(:disabled){border-color:var(--ink-4)}
.input:focus{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.input:disabled{background:var(--surface-3); color:var(--ink-4); cursor:not-allowed}
.input.num-input{text-align:end; font-variant-numeric:tabular-nums}
.input-sm{height:30px; font-size:var(--t-sm); padding:0 var(--s2); border-radius:var(--r1)}
.search-wrap{position:relative; flex:1 1 260px; min-width:200px}
.search-wrap .input{padding-inline-start:36px; padding-inline-end:34px}
.search-wrap .search-icon{position:absolute; inset-inline-start:11px; top:50%; transform:translateY(-50%); color:var(--ink-4); width:15px; height:15px}
.search-clear{position:absolute; inset-inline-end:6px; top:50%; transform:translateY(-50%)}

.check{display:inline-flex; align-items:center; gap:9px; cursor:pointer; user-select:none; font-size:var(--t-md)}
.check input{position:absolute; opacity:0; width:0; height:0}
.check-box{
width:17px; height:17px; flex:none; border-radius:5px; border:1.5px solid var(--line-2);
background:var(--surface); display:grid; place-items:center;
transition:background var(--d2) var(--ease), border-color var(--d2) var(--ease);
}
.check-box svg{width:11px; height:11px; color:var(--on-accent); opacity:0; transform:scale(.6); transition:opacity var(--d2) var(--ease), transform var(--d2) var(--ease-out)}
.check input:checked+.check-box{background:var(--accent-fill); border-color:var(--accent-fill)}
.check input:checked+.check-box svg{opacity:1; transform:scale(1)}
.check input:indeterminate+.check-box{background:var(--accent-fill); border-color:var(--accent-fill)}
.check input:indeterminate+.check-box::after{content:''; width:9px; height:1.5px; background:var(--on-accent); border-radius:2px}
.check input:indeterminate+.check-box svg{display:none}
.check input:focus-visible+.check-box{outline:2px solid var(--accent); outline-offset:2px}
.check:hover .check-box{border-color:var(--ink-4)}
.check input:disabled+.check-box{opacity:.4}
.check.check-sm .check-box{width:15px; height:15px; border-radius:4px}

.dd{position:relative; display:inline-flex}
.dd-trigger{
display:inline-flex; align-items:center; justify-content:space-between; gap:var(--s2);
height:38px; min-width:130px; padding:0 var(--s3); border-radius:var(--r2);
border:1px solid var(--line-2); background:var(--surface); color:var(--ink);
font-size:var(--t-md); cursor:pointer; text-align:start;
transition:border-color var(--d2) var(--ease), box-shadow var(--d2) var(--ease);
}
.dd-trigger:hover{border-color:var(--ink-4)}
.dd-trigger[aria-expanded="true"]{border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-wash)}
.dd-trigger .dd-value{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.dd-trigger .dd-caret{width:13px; height:13px; flex:none; color:var(--ink-4); transition:transform var(--d2) var(--ease)}
.dd-trigger[aria-expanded="true"] .dd-caret{transform:rotate(180deg)}
.dd-trigger.dd-sm{height:30px; font-size:var(--t-sm); min-width:96px; padding:0 var(--s2); border-radius:var(--r1)}
.dd-panel{
position:absolute; z-index:70; top:calc(100% + 5px); inset-inline-start:0; min-width:100%; max-width:340px;
max-height:290px; overflow:auto; padding:var(--s1);
background:var(--surface); border:1px solid var(--line-2); border-radius:var(--r2); box-shadow:var(--e3);
animation:pop var(--d2) var(--ease-out);
}
.dd-panel.align-end{inset-inline-start:auto; inset-inline-end:0}
@keyframes pop{from{opacity:0; transform:translateY(-4px) scale(.985)}to{opacity:1; transform:none}}
.dd-opt{
display:flex; align-items:center; gap:var(--s2); width:100%; padding:8px 10px; border:0; border-radius:var(--r1);
background:transparent; color:var(--ink); font-size:var(--t-md); text-align:start; cursor:pointer;
}
.dd-opt:hover,.dd-opt.active{background:var(--surface-3)}
.dd-opt[aria-selected="true"]{color:var(--accent-ink); font-weight:500}
.dd-opt .dd-tick{width:13px; height:13px; flex:none; opacity:0}
.dd-opt[aria-selected="true"] .dd-tick{opacity:1}
.dd-opt .dd-opt-icon{width:14px; height:14px; flex:none}
.dd-opt-count{margin-inline-start:auto; font-size:var(--t-xs); color:var(--ink-4)}
.dd-sep{height:1px; background:var(--line-3); margin:var(--s1) 6px}
.dd-group{padding:8px 10px 4px; font-size:var(--t-xs); font-weight:600; color:var(--ink-4)}
.chip{
display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px; border-radius:var(--r-pill);
border:1px solid var(--line-2); background:var(--surface); color:var(--ink-2);
font-size:var(--t-sm); font-weight:500; cursor:pointer; white-space:nowrap;
transition:background var(--d2) var(--ease), border-color var(--d2) var(--ease), color var(--d2) var(--ease);
}
.chip:hover{border-color:var(--ink-4); background:var(--surface-2)}
.chip[aria-pressed="true"]{background:var(--accent-wash); border-color:var(--accent-line); color:var(--accent-ink)}
.chip-count{font-size:11px; color:var(--ink-4); font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"] .chip-count{color:var(--accent-ink); opacity:.75}
.chip-x{width:12px; height:12px; opacity:.6}
.chip-row{display:flex; align-items:center; gap:var(--s2); flex-wrap:wrap}

.badge{display:inline-flex; align-items:center; gap:5px; height:22px; padding:0 9px; border-radius:var(--r-pill); font-size:var(--t-xs); font-weight:600; white-space:nowrap; border:1px solid transparent}
.badge svg{width:11px; height:11px}
.badge-ok{background:var(--ok-wash); color:var(--ok); border-color:var(--ok-line)}
.badge-warn{background:var(--warn-wash); color:var(--warn); border-color:var(--warn-line)}
.badge-danger{background:var(--danger-wash); color:var(--danger); border-color:var(--danger-line)}
.badge-info{background:var(--info-wash); color:var(--info); border-color:var(--info-line)}
.badge-neutral{background:var(--surface-3); color:var(--ink-3); border-color:var(--line)}
.badge-accent{background:var(--accent-wash); color:var(--accent-ink); border-color:var(--accent-line)}

.notice{display:flex; gap:var(--s3); padding:var(--s3) var(--s4); border-radius:var(--r2); border:1px solid var(--info-line); background:var(--info-wash); color:var(--ink-2); font-size:var(--t-sm); line-height:1.5}
.notice-icon{flex:none; width:16px; height:16px; margin-top:2px; color:var(--info)}
.notice-body{flex:1 1 auto; min-width:0}
.notice-title{font-weight:600; color:var(--ink); font-size:var(--t-md)}
.notice-actions{display:flex; gap:var(--s2); align-items:center; flex-wrap:wrap; margin-top:var(--s2)}
.notice-ok{border-color:var(--ok-line); background:var(--ok-wash)} .notice-ok .notice-icon{color:var(--ok)}
.notice-warn{border-color:var(--warn-line); background:var(--warn-wash)} .notice-warn .notice-icon{color:var(--warn)}
.notice-danger{border-color:var(--danger-line); background:var(--danger-wash)} .notice-danger .notice-icon{color:var(--danger)}
.notice-accent{border-color:var(--accent-line); background:var(--accent-wash)} .notice-accent .notice-icon{color:var(--accent-ink)}

.money{display:inline-flex; align-items:baseline; gap:1px; font-variant-numeric:tabular-nums; white-space:nowrap; direction:ltr}
.money-int{font-weight:600}
.money-frac{font-size:.78em; color:var(--ink-3); font-weight:500}
.money-neg{color:var(--danger)}
.money-zero{color:var(--ink-4)}
.money-lg .money-int{font-size:var(--t-2xl); letter-spacing:-.02em}
.money-xl .money-int{font-size:var(--t-3xl); letter-spacing:-.028em}
.cur{font-size:var(--t-xs); font-weight:500; color:var(--ink-4); letter-spacing:.02em}

.kpi-row{display:grid; grid-template-columns:repeat(auto-fit,minmax(196px,1fr)); gap:var(--s3)}
.kpi{position:relative; padding:var(--s4) var(--s4) var(--s4) var(--s4); background:var(--surface); border:1px solid var(--line); border-radius:var(--r3); box-shadow:var(--e1); overflow:hidden}
.kpi::before{content:''; position:absolute; inset-block:0; inset-inline-start:0; width:3px; background:var(--accent); opacity:.85}
.kpi.kpi-ok::before{background:var(--ok)} .kpi.kpi-warn::before{background:var(--warn)}
.kpi.kpi-danger::before{background:var(--danger)} .kpi.kpi-info::before{background:var(--info)}

  var TATWEEL = /ـ/g;
  var ARABIC_INDIC_DIGITS = '٠١٢٣٤٥٦٧٨٩';
  var EXTENDED_ARABIC_INDIC_DIGITS = '۰۱۲۳۴۵۶۷۸۹';

    s = s.replace(TASHKEEL, '');
    s = s.replace(TATWEEL, '');
    s = s.replace(/[أإآٱ]/g, 'ا');
    s = s.replace(/ة/g, 'ه');
    s = s.replace(/ى/g, 'ي');
    s = s.replace(/ؤ/g, 'و');
    s = s.replace(/ئ/g, 'ي');
    s = s.replace(/ﻻ|ﻹ|ﻷ|ﻵ/g, 'لا');

  function stripDefiniteArticleTokens(s) {

      .split(' ')
      .map(function (tok) {

  }

  function canonicalizeTierName(raw, tierNames) {

    if (!target) return null;
    for (var i = 0; i < tierNames.length; i++) {

    }

  }

  function toPiastres(egp) {
    return Math.round(egp * 100);
  }

  function fromPiastres(pi) {

  }

  function normalizePinnedPool(value) {

  }

  function resolveBaseValue(person, tiers) {

    if (person.tier != null && hasOwn(tiers, person.tier)) {

  function effectiveWeight(person, tiers, periodDays) {

    var base = resolveBaseValue(person, tiers);

    var attendance = clamp(days / periodDays, 0, 1);
    var penalty = clamp((person.penaltyRate == null || !isFinite(person.penaltyRate)) ? 0 : person.penaltyRate, 0, 1);
    var manual = (person.manualFactor == null || !isFinite(person.manualFactor) || person.manualFactor < 0) ? 1 : person.manualFactor;

  function effectiveGrossPiastres(gross, roundingStep) {
    var step = (roundingStep && roundingStep > 0) ? roundingStep : 1;
    return Math.round(toPiastres(gross) / step) * step;
  }

  function computePoolBudgets(pools, roundingStep) {
    var budgets = {};
    var effective = {};
    var N = 0;
    var names = Object.keys(pools);
    for (var i = 0; i < names.length; i++) {
      var name = names[i];
      var p = pools[name];
      var effPiastres = effectiveGrossPiastres(p.gross, roundingStep);
      var effGross = fromPiastres(effPiastres);
      var Np = effGross * (1 - p.taxRate);
      effective[name] = effGross;
      budgets[name] = Np;

  function assignItemsToPools(items, targets, opts) {

    var poolNames = Object.keys(targets);
    var eligiblePools = poolNames.filter(function (p) { return targets[p] > 0; });

    var assignment = {};
    var current = {};
    poolNames.forEach(function (p) { current[p] = 0; });

    var pinned = [];
    var free = [];
    items.forEach(function (it) {
      if (it.pinnedPool != null) pinned.push(it);

    pinned.forEach(function (it) {
      assignment[it.id] = it.pinnedPool;
      current[it.pinnedPool] = (current[it.pinnedPool] || 0) + it.weight;
    });

    var sortedFree = free.slice().sort(function (a, b) {
      if (b.weight !== a.weight) return b.weight - a.weight;

    if (eligiblePools.length === 0) {
      sortedFree.forEach(function (it) {
        var fallback = poolNames[0] || null;
        assignment[it.id] = fallback;
        if (fallback) current[fallback] = (current[fallback] || 0) + it.weight;
      });
      return { assignment: assignment, current: current, iterations: 0, converged: true };
    }

    sortedFree.forEach(function (it) {
      var bestPool = eligiblePools[0];
      var bestDeficit = targets[bestPool] - current[bestPool];
      for (var k = 1; k < eligiblePools.length; k++) {
        var p = eligiblePools[k];
        var deficit = targets[p] - current[p];
        if (deficit > bestDeficit) {
          bestDeficit = deficit;
          bestPool = p;
        }
      }
      assignment[it.id] = bestPool;
      current[bestPool] += it.weight;
    });

    var itemById = {};
    items.forEach(function (it) { itemById[it.id] = it; });

    var iterations = 0;
    var converged = false;
    var timeUp = false;
    var start = now();

    var swapWindow = opts.swapWindow != null ? opts.swapWindow : 24;
    var maxPasses = opts.maxPasses != null ? opts.maxPasses : 40;

    var freeIds = sortedFree.map(function (it) { return it.id; });

    var pass = 0;
    var movedInLastPass = true;
    while (movedInLastPass && pass < maxPasses) {
      if ((now() - start) >= timeBudgetMs) { timeUp = true; break; }
      pass++;
      movedInLastPass = false;

      for (var fi = 0; fi < freeIds.length; fi++) {
        iterations++;
        var id = freeIds[fi];
        var it = itemById[id];
        var fromPool = assignment[id];
        var bestGain = 0;
        var bestPool = null;
        for (var pi = 0; pi < eligiblePools.length; pi++) {
          var toPool = eligiblePools[pi];
          if (toPool === fromPool) continue;
          var newFrom = current[fromPool] - it.weight;
          var newTo = current[toPool] + it.weight;
          var deltaFrom = Math.abs(newFrom - targets[fromPool]) - Math.abs(current[fromPool] - targets[fromPool]);
          var deltaTo = Math.abs(newTo - targets[toPool]) - Math.abs(current[toPool] - targets[toPool]);
          var delta = deltaFrom + deltaTo;
          if (delta < bestGain - 1e-9) {
            bestGain = delta;
            bestPool = toPool;
          }
        }
        if (bestPool) {
          current[fromPool] -= it.weight;
          current[bestPool] += it.weight;
          assignment[id] = bestPool;
          movedInLastPass = true;
        }
      }

      for (var a = 0; a < freeIds.length; a++) {
        var idA = freeIds[a];
        var itA = itemById[idA];
        var poolA = assignment[idA];
        var bLimit = Math.min(freeIds.length, a + 1 + swapWindow);
        for (var b = a + 1; b < bLimit; b++) {
          iterations++;
          var idB = freeIds[b];
          var itB = itemById[idB];
          var poolB = assignment[idB];
          if (poolA === poolB) continue;
          var newA = current[poolA] - itA.weight + itB.weight;
          var newB = current[poolB] - itB.weight + itA.weight;
          var oldTermA = Math.abs(current[poolA] - targets[poolA]);
          var oldTermB = Math.abs(current[poolB] - targets[poolB]);
          var newTermA = Math.abs(newA - targets[poolA]);
          var newTermB = Math.abs(newB - targets[poolB]);
          if ((newTermA + newTermB) < (oldTermA + oldTermB) - 1e-9) {
            current[poolA] = newA;
            current[poolB] = newB;
            assignment[idA] = poolB;
            assignment[idB] = poolA;
            movedInLastPass = true;
            poolA = poolB;
          }
        }
      }
    }

    converged = !movedInLastPass && !timeUp;

    return { assignment: assignment, current: current, iterations: iterations, converged: converged, timeUp: timeUp, passes: pass };
  }

  function distributePoolPiastres(grossPiastres, members) {
    var W = 0;
    for (var i = 0; i < members.length; i++) W += members[i].weight;
    if (grossPiastres === 0) {
      return members.map(function () { return 0; });
    }
    if (W <= 0) {
      throw { code: 'ZERO_WEIGHT_NONZERO_GROSS', message: 'distributePoolPiastres called with zero total weight and nonzero gross' };
    }

    var floors = raw.map(Math.floor);
    var allocated = floors.reduce(function (a, b) { return a + b; }, 0);
    var remainder = grossPiastres - allocated;

    var order = members.map(function (m, i) {
      return { i: i, id: m.id, weight: m.weight, frac: raw[i] - floors[i] };
    });

      if (Math.abs(b.frac - a.frac) > 1e-9) return b.frac - a.frac;
      if (b.weight !== a.weight) return b.weight - a.weight;

    for (var k = 0; k < remainder; k++) {

    }

    var sum = grossc.reduce(function (a, b) { return a + b; }, 0);
    if (sum !== grossPiastres) {
      throw { code: 'CONSERVATION_FAILED', message: 'distributePoolPiastres: sum(grossc) !== grossPiastres', expected: grossPiastres, actual: sum };
    }

  }

  function validateState(state) {
    var errors = [];
    var pools = state.pools || {};
    var poolNames = Object.keys(pools);
    poolNames.forEach(function (name) {
      var p = pools[name];
      if (!(p.taxRate >= 0 && p.taxRate < 1)) {
        errors.push({ code: 'BAD_TAX_RATE', poolName: name, message: 'نسبة الخصم لمجمع "' + name + '" يجب أن تكون بين 0 و 1' });
      }
      if (!(p.gross >= 0)) {
        errors.push({ code: 'BAD_GROSS', poolName: name, message: 'إجمالي مجمع "' + name + '" لا يمكن أن يكون سالبًا' });
      }
    });
    if (poolNames.length === 0) {
      errors.push({ code: 'NO_POOLS', message: 'لا يوجد أي مجمع معرّف' });
    }
    if (!(state.periodDays >= 1)) {
      errors.push({ code: 'BAD_PERIOD_DAYS', message: 'عدد أيام الفترة يجب أن يكون 1 على الأقل' });
    }
    (state.people || []).forEach(function (person) {
      var pinned = normalizePinnedPool(person.pinnedPool);
      if (pinned != null && !hasOwn(pools, pinned)) {
        errors.push({ code: 'UNKNOWN_PINNED_POOL', personId: person.id, poolName: pinned, message: 'المجمع المقفول "' + pinned + '" غير موجود لـ "' + (person.name || person.id) + '"' });
      }

  }

  function collectRowWarnings(state) {
    var warnings = [];
    var periodDays = state.periodDays;
    var tiers = state.tiers || {};
    (state.people || []).forEach(function (person) {
      var label = person.name || ('صف ' + person.id);
      if (!person.name || !String(person.name).trim()) {
        warnings.push({ code: 'MISSING_NAME', personId: person.id, message: 'صف بدون اسم (رقم ' + person.id + ')' });
      }
      if (!person.excluded && !hasResolvableTier(person, tiers)) {
        warnings.push({ code: 'UNRESOLVED_TIER', personId: person.id, message: 'لا توجد فئة معروفة لـ "' + label + '" — خارج التوزيع' });
      }
      if (person.penaltyRate != null && !(person.penaltyRate >= 0 && person.penaltyRate <= 1)) {
        warnings.push({ code: 'BAD_PENALTY', personId: person.id, message: 'نسبة الجزاء خارج النطاق لـ "' + label + '" — تم تثبيتها داخل 0–1' });
      }
      if (person.daysWorked != null && !(person.daysWorked >= 0 && person.daysWorked <= periodDays)) {
        warnings.push({ code: 'BAD_DAYS', personId: person.id, message: 'أيام العمل خارج نطاق الفترة لـ "' + label + '" — تم تثبيتها داخل 0–' + periodDays });
      }
      if (person.manualFactor != null && !(person.manualFactor >= 0)) {
        warnings.push({ code: 'BAD_MANUAL_FACTOR', personId: person.id, message: 'المعامل اليدوي غير صالح لـ "' + label + '" — تم استخدام 1' });
      }
    });
    return warnings;
  }

  function runPipeline(state) {
    var validationErrors = validateState(state);
    if (validationErrors.length > 0) {
      return { ok: false, errors: validationErrors };
    }

    try {
      var t0 = now();
      var tiers = state.tiers || {};
      var pools = state.pools || {};
      var periodDays = state.periodDays;
      var roundingStep = (state.options && state.options.roundingStep) ? state.options.roundingStep : 1;
      var warnings = collectRowWarnings(state);

      var budgetInfo = computePoolBudgets(pools, roundingStep);
      var N = budgetInfo.N;
      var poolNames = budgetInfo.names;

      var people = state.people || [];
      var weighted = [];
      var unresolvedIds = [];
      for (var i = 0; i < people.length; i++) {
        var person = people[i];
        var w = effectiveWeight(person, tiers, periodDays);
        if (w == null) {
          unresolvedIds.push(person.id);
          weighted.push({ person: person, weight: 0, unresolvedTier: true });
        } else {
          weighted.push({ person: person, weight: w, unresolvedTier: false });
        }
      }

      var participating = weighted.filter(function (x) { return x.weight > 0; });
      var W = participating.reduce(function (s, x) { return s + x.weight; }, 0);

      if (W <= 0 && N > 0) {
        return {
          ok: false,
          errors: [{
            code: 'NO_ELIGIBLE_PEOPLE',
            message: 'لا يوجد أي شخص مؤهل للتوزيع (مجموع الأوزان صفر)',
            unresolvedCount: unresolvedIds.length

          warnings: warnings

      }

      var targets = {};
      poolNames.forEach(function (name) {

      });

      var assignItems = participating.map(function (x) {
        return { id: x.person.id, weight: x.weight, pinnedPool: normalizePinnedPool(x.person.pinnedPool) };
      });

      var assignResult = assignItemsToPools(assignItems, targets, {});
      var assignment = assignResult.assignment;

      var membersByPool = {};
      poolNames.forEach(function (name) { membersByPool[name] = []; });
      for (var ai = 0; ai < participating.length; ai++) {
        var px = participating[ai];
        var assignedPool = assignment[px.person.id];
        if (assignedPool == null) continue;
        if (!hasOwn(membersByPool, assignedPool)) {
          return { ok: false, errors: [{ code: 'UNKNOWN_PINNED_POOL', personId: px.person.id, poolName: assignedPool, message: 'المجمع المقفول "' + assignedPool + '" غير موجود' }] };
        }
        membersByPool[assignedPool].push({ id: px.person.id, weight: px.weight });
      }

      for (var pn = 0; pn < poolNames.length; pn++) {
        var checkName = poolNames[pn];
        if (budgetInfo.effectiveGross[checkName] > 0 && membersByPool[checkName].length === 0) {
          return { ok: false, errors: [{ code: 'EMPTY_POOL_WITH_BUDGET', poolName: checkName, message: 'مجمع "' + checkName + '" لديه مبلغ ولكن لا يوجد أي مستحق فيه' }] };
        }
      }

      var stepUnit = roundingStep;
      var poolResults = {};
      var peopleResultsById = {};

      for (var pj = 0; pj < poolNames.length; pj++) {
        var poolName = poolNames[pj];
        var poolDef = pools[poolName];
        var members = membersByPool[poolName];
        var actualWeight = members.reduce(function (s, m) { return s + m.weight; }, 0);
        var effGrossPi = effectiveGrossPiastres(poolDef.gross, stepUnit);
        var grossStepTotal = Math.round(effGrossPi / stepUnit);

        var grossStepPerMember = [];
        if (members.length > 0) {
          grossStepPerMember = distributePoolPiastres(grossStepTotal, members);
        }

        var targetWeight = targets[poolName];
        var deviation = actualWeight > 0 ? (targetWeight / actualWeight - 1) : null;
        var zeroBudgetWithMembers = effGrossPi === 0 && members.length > 0;
        var roundingAdjusted = effGrossPi !== toPiastres(poolDef.gross);

        poolResults[poolName] = {
          gross: poolDef.gross,
          effectiveGross: budgetInfo.effectiveGross[poolName],
          effectiveGrossPiastres: effGrossPi,
          roundingAdjusted: roundingAdjusted,
          taxRate: poolDef.taxRate,
          net: budgetInfo.budgets[poolName],
          targetWeight: targetWeight,
          actualWeight: actualWeight,
          deviation: deviation,
          zeroBudgetWithMembers: zeroBudgetWithMembers,
          memberCount: members.length
        };

        if (roundingAdjusted) {
          warnings.push({
            code: 'POOL_ROUNDED', poolName: poolName,
            message: 'تم تعديل إجمالي مجمع "' + poolName + '" من ' + fromPiastres(toPiastres(poolDef.gross)).toFixed(2) + ' إلى ' + fromPiastres(effGrossPi).toFixed(2) + ' ليناسب التقريب'
          });
        }
        if (zeroBudgetWithMembers) {
          warnings.push({
            code: 'ZERO_BUDGET_POOL', poolName: poolName,
            message: 'مجمع "' + poolName + '" بلا مبلغ — الأعضاء المثبّتون لن يحصلوا على شيء'
          });
        }

        for (var mi = 0; mi < members.length; mi++) {
          var grossPiastres = grossStepPerMember[mi] * stepUnit;
          var taxPiastres = Math.round(grossPiastres * poolDef.taxRate);
          var netPiastres = grossPiastres - taxPiastres;
          peopleResultsById[members[mi].id] = {
            id: members[mi].id,
            pool: poolName,
            weight: members[mi].weight,
            shareOfPoolWeight: actualWeight > 0 ? members[mi].weight / actualWeight : 0,
            grossPiastres: grossPiastres,
            taxPiastres: taxPiastres,
            netPiastres: netPiastres,
            idealNetEGP: k * members[mi].weight,
            unresolvedTier: false,
            excluded: false
          };
        }
      }

      weighted.forEach(function (x) {
        if (peopleResultsById[x.person.id]) return;
        peopleResultsById[x.person.id] = {
          id: x.person.id, pool: null, weight: 0, shareOfPoolWeight: 0,
          grossPiastres: 0, taxPiastres: 0, netPiastres: 0, idealNetEGP: 0,
          unresolvedTier: !!x.unresolvedTier,
          excluded: !!x.person.excluded
        };
      });

      var orderedPeople = people.map(function (p) { return peopleResultsById[p.id]; });
      var t1 = now();

      return {
        ok: true,
        k: k,
        W: W,
        N: N,
        poolResults: poolResults,
        people: orderedPeople,
        assignment: assignment,
        warnings: warnings,
        unresolvedTierIds: unresolvedIds,
        meta: { timingMs: t1 - t0, converged: assignResult.converged, passes: assignResult.passes }
      };
    } catch (e) {
      return {
        ok: false,
        errors: [{
          code: (e && e.code) || 'INTERNAL_ERROR',
          message: (e && e.message) || 'خطأ داخلي غير متوقع في محرك الحساب',
          detail: e
        }]
      };
    }
  }

  return {
    normalizeArabic: normalizeArabic,
    normalizeLoose: normalizeLoose,
    normalizeForTierMatch: normalizeForTierMatch,
    canonicalizeTierName: canonicalizeTierName,
    toPiastres: toPiastres,
    fromPiastres: fromPiastres,
    effectiveWeight: effectiveWeight,
    effectiveGrossPiastres: effectiveGrossPiastres,
    resolveBaseValue: resolveBaseValue,
    hasResolvableTier: hasResolvableTier,
    computePoolBudgets: computePoolBudgets,
    assignItemsToPools: assignItemsToPools,
    distributePoolPiastres: distributePoolPiastres,
    validateState: validateState,
    collectRowWarnings: collectRowWarnings,
    normalizePinnedPool: normalizePinnedPool,
    runPipeline: runPipeline,
    clamp: clamp,
    compareIds: compareIds,
    hasOwn: hasOwn
  };
})();

<script>
var DemoData = (function () {
  'use strict';
  var FIRST = ['أحمد', 'محمد', 'محمود', 'مصطفى', 'خالد', 'عمر', 'يوسف', 'كريم', 'طارق', 'هاني', 'سمير', 'وليد', 'فادي', 'عادل', 'ماهر', 'إسلام', 'زياد', 'أنس', 'بلال', 'حسن', 'فاطمة', 'مريم', 'نور', 'سارة', 'هدى', 'أمنية', 'رنا', 'دينا', 'ياسمين', 'شيماء', 'منى', 'إيمان', 'ندى', 'سلمى', 'حبيبة'];
  var LAST = ['عبد الرحمن', 'السيد', 'حسين', 'إبراهيم', 'الشريف', 'منصور', 'فؤاد', 'الجندي', 'رشاد', 'زكي', 'العطار', 'شلبي', 'البهنساوي', 'الديب', 'قنديل', 'صابر', 'مرسي', 'الحلواني', 'نصار', 'عويس'];
  var DEPTS = ['الإدارة العامة', 'إدارة الحسابات', 'إدارة الشئون الطبية', 'إدارة الموارد البشرية', 'إدارة السجلات', 'إدارة المشتريات'];
  var TIERS = ['مدير إدارة', 'مدير', 'رئيس قسم', 'عضو مميز', 'شهادة عليا', 'فوق متوسط', 'متوسط', 'معاون خدمة'];
  var TIER_JOB = {
    'مدير إدارة': 'مدير عام الإدارة',
    'مدير': 'مدير الإدارة',
    'رئيس قسم': 'رئيس قسم',
    'عضو مميز': 'أخصائي أول',
    'شهادة عليا': 'أخصائي',
    'فوق متوسط': 'فني أول',
    'متوسط': 'فني',
    'معاون خدمة': 'معاون خدمة'
  };
  var TIER_SHARE = [0.02, 0.05, 0.09, 0.12, 0.18, 0.2, 0.22, 0.12];

  function pickTier(u) {
    var acc = 0;
    for (var i = 0; i < TIERS.length; i++) {
      acc += TIER_SHARE[i];
      if (u < acc) return TIERS[i];
    }
    return TIERS[TIERS.length - 1];
  }

  function makeRng(seed) {
    var s = seed || 20260807;
    return function () {
      s = (s * 1103515245 + 12345) & 0x7fffffff;
      return s / 0x7fffffff;
    };
  }

  function people(count, seed) {
    var rnd = makeRng(seed);
    var out = [];
    for (var i = 0; i < count; i++) {
      var name = FIRST[Math.floor(rnd() * FIRST.length)] + ' ' + LAST[Math.floor(rnd() * LAST.length)];
      var tier = pickTier(rnd());
      var r = rnd();
      out.push({
        id: i + 1,
        name: name,
        job: TIER_JOB[tier] || '',
        dept: DEPTS[Math.floor(rnd() * DEPTS.length)],
        tier: tier,
        daysWorked: r < 0.16 ? Math.floor(rnd() * 26) + 1 : null,
        penaltyRate: r > 0.9 ? Math.round(rnd() * 20) / 100 : null,
        manualFactor: null,
        overrideValue: null,
        pinnedPool: null,
        excluded: r > 0.97,
        notes: ''

    }
    if (out.length > 6) {
      out[3].tier = 'درجة ثالثة';
      out[3].job = '';
      out[4].overrideValue = 1800;
      out[5].manualFactor = 1.25;
    }
    return out;
  }

  return { people: people, DEPTS: DEPTS, TIERS: TIERS, TIER_JOB: TIER_JOB };
})();

var Reports = (function () {
  'use strict';

  function poolNamesOf(state) { return Object.keys(state.pools || {}); }

  function personById(state) {

  }

  function resultById(result) {

  }

        name: p.name || '',
        job: p.job || '',
        dept: p.dept || '',
        tier: p.tier || '',
        pool: r.pool || '',
        weight: r.weight,
        days: p.daysWorked == null ? state.periodDays : p.daysWorked,
        penalty: p.penaltyRate == null ? 0 : p.penaltyRate,
        manual: p.manualFactor == null ? 1 : p.manualFactor,
        override: p.overrideValue,
        pinned: p.pinnedPool || '',

        tax: r.taxPiastres / 100,

      return {
        id: id,
        name: p.name || '',
        dept: p.dept || '',
        tier: p.tier || '',
        days: p.daysWorked == null ? state.periodDays : p.daysWorked,
        notes: p.notes || '',
        cause: p.tier ? 'الفئة "' + p.tier + '" غير معرّفة في إعدادات الفئات' : 'لا توجد فئة مُدخلة ولا قيمة مخصصة'
      };
    });
  }

  function excludedRows(state) {
    return (state.people || []).filter(function (p) { return p.excluded; }).map(function (p) {
      return { id: p.id, name: p.name || '', dept: p.dept || '', tier: p.tier || '', notes: p.notes || '' };
    });
  }

  function specialCasePeople(state) {
    return (state.people || []).filter(isSpecial);
  }

  function specialRows(state, result) {
    var rmap = resultById(result);
    return specialCasePeople(state).map(function (p) {
      var r = rmap[p.id] || { netPiastres: 0, weight: 0, pool: null };
      return {
        id: p.id, name: p.name || '', dept: p.dept || '', tier: p.tier || '',
        pool: r.pool || '', weight: r.weight, net: r.netPiastres / 100,
        reason: specialReason(p), notes: p.notes || ''
      };
    });
  }

  function executiveRows(state, result) {
    var rows = detailRows(state, result);
    var paid = rows.filter(function (r) { return r.net > 0; });
    var totalNet = rows.reduce(function (s, r) { return s + r.net; }, 0);
    var totalGross = rows.reduce(function (s, r) { return s + r.gross; }, 0);
    var totalTax = rows.reduce(function (s, r) { return s + r.tax; }, 0);
    var maxDrift = rows.reduce(function (m, r) { return Math.max(m, Math.abs(r.drift)); }, 0);
    var pools = poolNamesOf(state);
    var declaredGross = pools.reduce(function (s, n) { return s + state.pools[n].gross; }, 0);
    var effectiveGross = pools.reduce(function (s, n) {
      return s + ((result && result.poolResults && result.poolResults[n]) ? result.poolResults[n].effectiveGross : state.pools[n].gross);
    }, 0);
    var unresolved = unresolvedRows(state, result);
    var out = [
      { label: 'عدد الأشخاص في الملف', value: rows.length, kind: 'int' },
      { label: 'عدد المستحقين', value: paid.length, kind: 'int' },
      { label: 'عدد المستبعدين يدويًا', value: excludedRows(state).length, kind: 'int' },
      { label: 'عدد بدون فئة (خارج التوزيع)', value: unresolved.length, kind: 'int' },
      { label: 'عدد الحالات الخاصة', value: specialCasePeople(state).length, kind: 'int' },
      { label: 'عدد المجمعات', value: pools.length, kind: 'int' },
      { label: 'أيام الفترة', value: state.periodDays, kind: 'int' },
      { label: 'الإجمالي المُدخل', value: declaredGross, kind: 'money' },
      { label: 'الإجمالي بعد التقريب', value: effectiveGross, kind: 'money' },
      { label: 'إجمالي الخصومات', value: totalTax, kind: 'money' },
      { label: 'إجمالي الصافي الموزّع', value: totalNet, kind: 'money' },
      { label: 'فرق التقريب عن المُدخل', value: effectiveGross - declaredGross, kind: 'money' },
      { label: 'أقصى انحراف فردي عن المثالي', value: maxDrift, kind: 'money' },
      { label: 'معامل التوزيع k', value: (result && result.k) || 0, kind: 'rate' },
      { label: 'مجموع الأوزان W', value: (result && result.W) || 0, kind: 'rate' }
    ];
    out.__totals = { totalNet: totalNet, totalGross: totalGross, totalTax: totalTax, effectiveGross: effectiveGross, declaredGross: declaredGross, unresolved: unresolved.length };
    return out;
  }

  function poolRows(state, result) {
    return poolNamesOf(state).map(function (name) {
      var pr = (result && result.poolResults && result.poolResults[name]) || {};
      return {
        name: name,
        gross: state.pools[name].gross,
        effectiveGross: pr.effectiveGross == null ? state.pools[name].gross : pr.effectiveGross,
        taxRate: state.pools[name].taxRate,
        net: pr.net || 0,
        members: pr.memberCount || 0,
        targetWeight: pr.targetWeight || 0,
        actualWeight: pr.actualWeight || 0,
        deviation: pr.deviation,
        zeroBudget: !!pr.zeroBudgetWithMembers,
        rounded: !!pr.roundingAdjusted
      };
    });
  }

  function deptRows(state, result) {
    var rows = detailRows(state, result);
    var byDept = Object.create(null);
    rows.forEach(function (r) {
      var key = r.dept || 'بدون قسم';
      if (!byDept[key]) byDept[key] = { dept: key, count: 0, paid: 0, weight: 0, gross: 0, tax: 0, net: 0, unresolved: 0, excluded: 0 };
      var b = byDept[key];
      b.count++;
      if (r.net > 0) b.paid++;
      if (r.unresolvedTier) b.unresolved++;
      if (r.excluded) b.excluded++;
      b.weight += r.weight;
      b.gross += r.gross;
      b.tax += r.tax;
      b.net += r.net;
    });
    var out = Object.keys(byDept).map(function (k) { return byDept[k]; });
    out.sort(function (a, b) { return b.net - a.net || Sorter.compareValues(a.dept, b.dept); });
    return out;
  }

  function tierRows(state, result) {
    var rows = detailRows(state, result);
    var byTier = Object.create(null);
    rows.forEach(function (r) {
      var key = r.tier || 'بدون فئة';
      if (!byTier[key]) byTier[key] = { tier: key, base: (state.tiers || {})[key] != null ? state.tiers[key] : null, count: 0, weight: 0, net: 0, unresolved: 0 };
      var b = byTier[key];
      b.count++;
      b.weight += r.weight;
      b.net += r.net;
      if (r.unresolvedTier) b.unresolved++;
    });
    var out = Object.keys(byTier).map(function (k) { return byTier[k]; });
    out.sort(function (a, b) { return b.net - a.net || Sorter.compareValues(a.tier, b.tier); });
    return out;
  }

  function methodologyRows(state, result) {
    var pools = poolRows(state, result);
    var rows = [
      ['طريقة التوزيع', 'وزن نسبي لكل شخص = قيمة الفئة × نسبة الحضور × (1 − الجزاء) × المعامل اليدوي'],
      ['وحدة الحساب', 'قرش صحيح (بدون كسور عائمة) — كل المبالغ محفوظة كأعداد صحيحة'],
      ['وحدة التقريب', String((state.options && state.options.roundingStep) || 1) + ' قرش'],
      ['توزيع البواقي', 'أكبر باقٍ، ثم الوزن الأكبر، ثم رقم الصف — نتيجة واحدة ثابتة لنفس المدخلات'],
      ['حفظ الإجمالي', 'مجموع أنصبة كل مجمع = إجمالي المجمع بعد التقريب، بالقرش، بلا فرق'],
      ['الفئات غير المعروفة', 'يُستبعد الشخص من التوزيع ويظهر في ورقة "بدون فئة" ولا يحصل على أي مبلغ'],
      ['أيام الفترة', String(state.periodDays) + ' يوم'],
      ['معامل التوزيع k', Fmt.egp((result && result.k) || 0, 4) + ' جنيه لكل وحدة وزن'],
      ['مجموع الأوزان W', Fmt.egp((result && result.W) || 0, 4)],
      ['إجمالي الصافي N', Fmt.egp((result && result.N) || 0, 2)]
    ];
    pools.forEach(function (p) {
      rows.push([
        'مجمع: ' + p.name,
        'مُدخل ' + Fmt.egp(p.gross) + ' → بعد التقريب ' + Fmt.egp(p.effectiveGross) +
        ' | خصم ' + Fmt.pctExact(p.taxRate) + ' | صافي ' + Fmt.egp(p.net) +
        ' | أعضاء ' + Fmt.int(p.members) + (p.rounded ? ' | تم تعديل الإجمالي للتقريب' : '') + (p.zeroBudget ? ' | بلا مبلغ' : '')
      ]);
    });
    return rows;
  }

  function warningRows(result) {
    var labels = {
      MISSING_NAME: 'صف بدون اسم', UNRESOLVED_TIER: 'بدون فئة — خارج التوزيع',
      BAD_PENALTY: 'نسبة جزاء غير صالحة', BAD_DAYS: 'أيام عمل خارج النطاق',
      BAD_MANUAL_FACTOR: 'معامل يدوي غير صالح', POOL_ROUNDED: 'تعديل إجمالي للتقريب',
      ZERO_BUDGET_POOL: 'مجمع بلا مبلغ'
    };
    return ((result && result.warnings) || []).map(function (w) {
      return { code: w.code, kind: labels[w.code] || w.code, target: w.personId != null ? ('صف ' + w.personId) : (w.poolName || '—'), message: w.message };
    });
  }

  function conservationCheck(state, result) {
    var pools = poolNamesOf(state);
    var problems = [];
    pools.forEach(function (name) {
      var pr = result && result.poolResults && result.poolResults[name];
      if (!pr) return;
      var sum = 0;
      (result.people || []).forEach(function (r) { if (r.pool === name) sum += r.grossPiastres; });
      if (sum !== pr.effectiveGrossPiastres) {
        problems.push({ pool: name, expected: pr.effectiveGrossPiastres, actual: sum });
      }
    });
    return { ok: problems.length === 0, problems: problems };
  }

  return {
    detailRows: detailRows, executiveRows: executiveRows, poolRows: poolRows,
    deptRows: deptRows, tierRows: tierRows, specialRows: specialRows, specialCasePeople: specialCasePeople,
    unresolvedRows: unresolvedRows, excludedRows: excludedRows, methodologyRows: methodologyRows,
    warningRows: warningRows, conservationCheck: conservationCheck, isSpecial: isSpecial, specialReason: specialReason
  };
})();
</script>
<script>
var Exporter = (function () {
  'use strict';

  var M2 = '#,##0.00';
  var M4 = '#,##0.0000';
  var PCT = '0.00%';
  var INT = '#,##0';

  function sanitizeSheetName(name, used) {
    var s = String(name == null ? 'ورقة' : name).replace(/[\\\/\?\*\[\]:]/g, ' ').replace(/\s+/g, ' ').trim();
    if (!s) s = 'ورقة';
    if (s.length > 31) s = s.slice(0, 31);
    if (!used) return s;
    var base = s, n = 2;
    while (used[s]) {
      var suffix = ' (' + n + ')';
      s = base.slice(0, Math.max(1, 31 - suffix.length)) + suffix;
      n++;
    }
    used[s] = true;
    return s;
  }

  function aoaSheet(rows, opts) {
    opts = opts || {};
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var range = XLSX.utils.decode_range(ws['!ref']);
    var headerRows = opts.headerRows == null ? 1 : opts.headerRows;
    var formats = opts.formats || {};

    for (var c = range.s.c; c <= range.e.c; c++) {
      var fmt = formats[c];
      if (!fmt) continue;
      for (var r = range.s.r + headerRows; r <= range.e.r; r++) {
        var addr = XLSX.utils.encode_cell({ r: r, c: c });
        var cell = ws[addr];
        if (cell && typeof cell.v === 'number') cell.z = fmt;
      }
    }

    if (opts.widths) {
      ws['!cols'] = opts.widths.map(function (w) { return { wch: w }; });
    } else {
      var cols = [];
      for (var cc = range.s.c; cc <= range.e.c; cc++) {
        var max = 10;
        for (var rr = range.s.r; rr <= range.e.r; rr++) {
          var a = XLSX.utils.encode_cell({ r: rr, c: cc });
          var v = ws[a] ? ws[a].v : '';
          var len = String(v == null ? '' : v).length;
          if (len > max) max = len;
        }
        cols.push({ wch: Math.min(42, max + 2) });
      }
      ws['!cols'] = cols;
    }

    if (opts.autofilter !== false && headerRows > 0 && range.e.r > range.s.r) {
      ws['!autofilter'] = { ref: XLSX.utils.encode_range({ s: { r: range.s.r, c: range.s.c }, e: { r: range.e.r, c: range.e.c } }) };
    }
    return ws;
  }

  function addSheet(wb, used, name, rows, opts) {
    if (!rows || rows.length === 0) return;
    XLSX.utils.book_append_sheet(wb, aoaSheet(rows, opts), sanitizeSheetName(name, used));
  }

  function newWorkbook() {

  }

  function kindFormat(kind) {

  }

  function sheetExec(wb, used, state, result, meta) {

    exec.forEach(function (r) { execRows.push([r.label, r.value]); });
    execRows.push([]);
    execRows.push(['التقرير أُنتج في', Fmt.humanTime(meta.at)]);
    execRows.push(['إصدار التطبيق', meta.version]);
    execRows.push(['نطاق التقرير', 'كل الأشخاص في الملف — لا تتأثر أرقام هذا التقرير بأي بحث أو فلتر على الشاشة']);
    var unresolvedCount = exec.__totals.unresolved;
    if (unresolvedCount > 0) {
      execRows.push([]);
      execRows.push(['تنبيه مسؤولية', 'يوجد ' + unresolvedCount + ' شخص بدون فئة معروفة. تم استبعادهم من التوزيع ولم يحصلوا على أي مبلغ. راجع ورقة "بدون فئة" وقرّر إما تعريف فئتهم أو استبعادهم رسميًا.']);
    }
    addSheet(wb, used, 'الملخص التنفيذي', execRows, { widths: [42, 22], autofilter: false, formats: { 1: M2 } });
  }

  function sheetPools(wb, used, state, result) {
    var poolsHdr = ['المجمع', 'الإجمالي المُدخل', 'الإجمالي بعد التقريب', 'نسبة الخصم', 'الصافي', 'عدد الأعضاء', 'الوزن المستهدف', 'الوزن الفعلي', 'الانحراف', 'ملاحظة'];
    var poolBody = Reports.poolRows(state, result).map(function (p) {
      return [p.name, p.gross, p.effectiveGross, p.taxRate, p.net, p.members, p.targetWeight, p.actualWeight,
        p.deviation == null ? '' : p.deviation,
        (p.zeroBudget ? 'بلا مبلغ — الأعضاء المثبّتون لن يحصلوا على شيء' : '') + (p.rounded ? (p.zeroBudget ? ' | ' : '') + 'تم تعديل الإجمالي للتقريب' : '')];
    });
    addSheet(wb, used, 'المجمعات', [poolsHdr].concat(poolBody), {
      formats: { 1: M2, 2: M2, 3: PCT, 4: M2, 5: INT, 6: M4, 7: M4, 8: PCT }
    });
  }

  function sheetDetail(wb, used, state, result) {
    var detHdr = ['#', 'الاسم', 'القسم', 'الفئة', 'المجمع', 'الوزن', 'الأيام', 'الجزاء', 'المعامل', 'قيمة مخصصة', 'مقفول على', 'مستبعد', 'بدون فئة', 'الإجمالي', 'الخصم', 'الصافي', 'الصافي المثالي', 'الفرق', 'حالة خاصة', 'السبب', 'ملاحظات'];
    var detBody = Reports.detailRows(state, result).map(function (r) {
      return [r.id, r.name, r.dept, r.tier, r.pool, r.weight, r.days, r.penalty, r.manual,
        r.override == null ? '' : r.override, r.pinned, r.excluded ? 'نعم' : '', r.unresolvedTier ? 'نعم' : '',
        r.gross, r.tax, r.net, r.ideal, r.drift, r.special ? 'نعم' : '', r.reason, r.notes];
    });
    addSheet(wb, used, 'التفصيل الكامل', [detHdr].concat(detBody), {
      formats: { 0: INT, 5: M4, 6: INT, 7: PCT, 8: M4, 9: M2, 13: M2, 14: M2, 15: M2, 16: M2, 17: M2 }
    });
  }

  function sheetUnresolved(wb, used, state, result) {
    var unresolved = Reports.unresolvedRows(state, result);
    if (unresolved.length === 0) return;
    var unHdr = ['#', 'الاسم', 'القسم', 'الفئة المُدخلة', 'الأيام', 'سبب الاستبعاد', 'ملاحظات', 'قرار المستخدم'];
    var unBody = unresolved.map(function (r) { return [r.id, r.name, r.dept, r.tier, r.days, r.cause, r.notes, '']; });
    unBody.unshift([]);
    unBody.unshift(['هؤلاء الأشخاص لم يدخلوا في التوزيع ولم يحصلوا على أي مبلغ. المسؤولية عن مراجعتهم على المستخدم.']);
    addSheet(wb, used, 'بدون فئة', [unHdr].concat(unBody), { formats: { 0: INT, 4: INT }, autofilter: false });
  }

  function sheetSpecial(wb, used, state, result) {
    var specials = Reports.specialRows(state, result);
    if (specials.length === 0) return;
    var spHdr = ['#', 'الاسم', 'القسم', 'الفئة', 'المجمع', 'الوزن', 'الصافي', 'سبب الحالة الخاصة', 'ملاحظات'];
    var spBody = specials.map(function (r) { return [r.id, r.name, r.dept, r.tier, r.pool, r.weight, r.net, r.reason, r.notes]; });
    addSheet(wb, used, 'الحالات الخاصة', [spHdr].concat(spBody), { formats: { 0: INT, 5: M4, 6: M2 } });
  }

  function sheetDept(wb, used, state, result) {
    var deptHdr = ['القسم', 'العدد', 'المستحقون', 'مستبعدون', 'بدون فئة', 'مجموع الأوزان', 'الإجمالي', 'الخصم', 'الصافي'];
    var deptBody = Reports.deptRows(state, result).map(function (d) {
      return [d.dept, d.count, d.paid, d.excluded, d.unresolved, d.weight, d.gross, d.tax, d.net];
    });

      return ['الإجمالي', acc[1] + r[1], acc[2] + r[2], acc[3] + r[3], acc[4] + r[4], acc[5] + r[5], acc[6] + r[6], acc[7] + r[7], acc[8] + r[8]];
    }, ['الإجمالي', 0, 0, 0, 0, 0, 0, 0, 0]);
    addSheet(wb, used, 'حسب القسم', [deptHdr].concat(deptBody).concat([deptTotal]), {
      formats: { 1: INT, 2: INT, 3: INT, 4: INT, 5: M4, 6: M2, 7: M2, 8: M2 }
    });
  }

  function sheetTier(wb, used, state, result) {
    var tierHdr = ['الفئة', 'القيمة الأساسية', 'العدد', 'مجموع الأوزان', 'الصافي', 'بدون فئة معروفة'];

    });

  }

  function sheetWarnings(wb, used, state, result) {

    var wBody = warns.map(function (w) { return [w.kind, w.target, w.message, w.code]; });
    addSheet(wb, used, 'التنبيهات', [wHdr].concat(wBody), { widths: [26, 14, 70, 22] });
  }

  function sheetMethodology(wb, used, state, result) {
    addSheet(wb, used, 'المنهجية', [['البند', 'التفصيل']].concat(Reports.methodologyRows(state, result)), { widths: [26, 100], autofilter: false });
  }

  var BASE_SHEET_BUILDERS = [
    { key: 'exec', label: 'الملخص التنفيذي', run: sheetExec },
    { key: 'pools', label: 'المجمعات', run: sheetPools },
    { key: 'detail', label: 'التفصيل الكامل', run: sheetDetail },
    { key: 'unresolved', label: 'بدون فئة', run: sheetUnresolved },
    { key: 'special', label: 'الحالات الخاصة', run: sheetSpecial },
    { key: 'dept', label: 'حسب القسم', run: sheetDept },
    { key: 'tier', label: 'حسب الفئة', run: sheetTier },
    { key: 'warnings', label: 'التنبيهات', run: sheetWarnings },
    { key: 'methodology', label: 'المنهجية', run: sheetMethodology }
  ];

  function sheetRegistry(state) {
    var registry = BASE_SHEET_BUILDERS.slice();
    Object.keys(state.pools || {}).forEach(function (poolName) {
      registry.push({
        key: 'pool:' + poolName,
        label: poolName,
        run: function (wb, used, st, result) { addPoolSheet(wb, used, st, result, poolName); }
      });
    });
    return registry;
  }

  function buildFullReport(state, result, meta) {
    var wb = newWorkbook();
    var used = Object.create(null);
    sheetRegistry(state).forEach(function (b) { b.run(wb, used, state, result, meta); });
    return wb;
  }

  function poolDetailRows(state, result, poolName) {
    return Reports.detailRows(state, result).filter(function (r) { return r.pool === poolName; });
  }

  function addPoolSheet(wb, used, state, result, poolName) {
    var rows = poolDetailRows(state, result, poolName);
    if (rows.length === 0) return;
    var hdr = ['#', 'الاسم', 'القسم', 'الفئة', 'الوزن', 'الأيام', 'الجزاء', 'المعامل', 'قيمة مخصصة', 'مقفول على', 'مستبعد', 'الإجمالي', 'الخصم', 'الصافي', 'الصافي المثالي', 'الفرق', 'حالة خاصة', 'السبب', 'ملاحظات'];
    var body = rows.map(function (r) {
      return [r.id, r.name, r.dept, r.tier, r.weight, r.days, r.penalty, r.manual,
        r.override == null ? '' : r.override, r.pinned, r.excluded ? 'نعم' : '',
        r.gross, r.tax, r.net, r.ideal, r.drift, r.special ? 'نعم' : '', r.reason, r.notes];
    });
    var totalRow = ['الإجمالي', '', '', '', '', '', '', '', '', '', '',
      Math.round(body.reduce(function (s, r) { return s + r[11]; }, 0) * 100) / 100,

    var withData = mode === 'current';
    var wb = newWorkbook();

    addSheet(wb, used, 'المجمعات المعرّفة', poolsRows, { formats: { 1: M2, 2: PCT }, autofilter: false });

  function buildSettingsExport(state, result, scope) {
    var wb = newWorkbook();

    if (scope.people) {
      var detHdr = ['#', 'الاسم', 'القسم', 'الفئة', 'المجمع', 'الوزن', 'الأيام', 'الجزاء', 'المعامل', 'قيمة مخصصة', 'مقفول على', 'مستبعد', 'بدون فئة', 'الإجمالي', 'الخصم', 'الصافي', 'ملاحظات'];
      var detBody = Reports.detailRows(state, result).map(function (r) {
        return [r.id, r.name, r.dept, r.tier, r.pool, r.weight, r.days, r.penalty, r.manual,
          r.override == null ? '' : r.override, r.pinned, r.excluded ? 'نعم' : '', r.unresolvedTier ? 'نعم' : '',
          r.gross, r.tax, r.net, r.notes];
      });
      addSheet(wb, used, 'جدول الأشخاص', [detHdr].concat(detBody), {
        formats: { 0: INT, 5: M4, 6: INT, 7: PCT, 8: M4, 9: M2, 13: M2, 14: M2, 15: M2 }

    if (scope.special) {

      var spBody = Reports.specialRows(state, result).map(function (r) {
        return [r.id, r.name, r.dept, r.tier, r.pool, r.weight, r.net, r.reason, r.notes];
      });
      addSheet(wb, used, 'الحالات الخاصة', [spHdr].concat(spBody), { formats: { 0: INT, 5: M4, 6: M2 } });
    }
    return wb;
  }

  function write(wb, filename) {
    XLSX.writeFile(wb, filename, { bookType: 'xlsx', compression: true });
  }

  function available() {
    return typeof XLSX !== 'undefined';
  }

  function toCsv(rows) {
    return (rows || []).map(function (row) {
      return (row || []).map(function (cell) {
        if (cell == null) return '';
        var s = String(cell);
        return /[",\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
      }).join(',');
    }).join('\r\n');
  }

  function writeCsv(rows, filename) {
    var blob = new Blob(['﻿' + toCsv(rows)], { type: 'text/csv;charset=utf-8' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }

  function detailAoa(state, result) {
    var hdr = ['#', 'الاسم', 'الوظيفة', 'القسم', 'الفئة', 'المجمع', 'الوزن', 'الأيام', 'الجزاء', 'المعامل',

    write: write, writeCsv: writeCsv, toCsv: toCsv, available: available,
    sanitizeSheetName: sanitizeSheetName, newWorkbook: newWorkbook, kindFormat: kindFormat,
    FORMATS: { M2: M2, M4: M4, PCT: PCT, INT: INT }
  };
})();

var Importer = (function () {
  'use strict';

  var FIELDS = [
    { key: 'name', label: 'الاسم', required: true, hints: ['الاسم', 'اسم', 'name', 'الموظف', 'العامل'] },
    { key: 'job', label: 'الوظيفة', hints: ['الوظيفة', 'الوظيفه', 'وظيفة', 'job', 'title', 'المسمى'] },
    { key: 'dept', label: 'القسم', hints: ['القسم', 'قسم', 'dept', 'department', 'الاداره', 'الإدارة'] },
    { key: 'tier', label: 'الفئة', required: true, hints: ['الفئة', 'فئة', 'tier', 'category', 'الدرجه', 'الدرجة', 'المستوى'] },
    { key: 'daysWorked', label: 'أيام العمل', hints: ['ايام', 'أيام', 'days', 'الحضور', 'ايام العمل'] },
    { key: 'penaltyRate', label: 'نسبة الجزاء', hints: ['جزاء', 'خصم', 'penalty', 'جزاءات'] },
    { key: 'manualFactor', label: 'المعامل اليدوي', hints: ['معامل', 'factor', 'المعامل'] },
    { key: 'overrideValue', label: 'قيمة مخصصة', hints: ['قيمة مخصصة', 'قيمه مخصصه', 'override', 'قيمة خاصة'] },
    { key: 'pinnedPool', label: 'المجمع المقفول', hints: ['المجمع', 'مجمع', 'pool', 'مقفول'] },
    { key: 'excluded', label: 'مستبعد', hints: ['مستبعد', 'استبعاد', 'excluded', 'خارج'] },
    { key: 'notes', label: 'ملاحظات', hints: ['ملاحظات', 'ملاحظة', 'notes', 'note'] }
  ];

  function autoMap(headers) {
    var map = {};
    var used = {};
    var normHeaders = (headers || []).map(function (h) { return Engine.normalizeForTierMatch(h); });
    FIELDS.forEach(function (f) {
      for (var hi = 0; hi < normHeaders.length; hi++) {
        if (used[hi]) continue;
        for (var k = 0; k < f.hints.length; k++) {
          var hint = Engine.normalizeForTierMatch(f.hints[k]);
          if (normHeaders[hi] === hint || normHeaders[hi].indexOf(hint) !== -1) {
            map[f.key] = hi;
            used[hi] = true;
            return;
          }
        }
      }
    });
    return map;
  }

  function rowToPerson(row, mapping, id, tierNames, poolNames) {
    function cell(key) {
      var idx = mapping[key];
      if (idx == null) return null;
      var v = row[idx];
      return (v == null || v === '') ? null : v;
    }
    var rawTier = cell('tier');
    var canonTier = rawTier == null ? null : Engine.canonicalizeTierName(rawTier, tierNames);
    var rawPool = cell('pinnedPool');
    var canonPool = rawPool == null ? null : Engine.canonicalizeTierName(rawPool, poolNames);
    var rawName = cell('name');
    return {
      id: id,
      name: rawName == null ? '' : String(rawName).trim(),
      job: cell('job') == null ? '' : String(cell('job')).trim(),
      dept: cell('dept') == null ? '' : String(cell('dept')).trim(),
      tier: canonTier != null ? canonTier : (rawTier == null ? '' : String(rawTier).trim()),
      daysWorked: Fmt.parseNumber(cell('daysWorked')),
      penaltyRate: (function () {
        var n = Fmt.parseNumber(cell('penaltyRate'));
        if (n == null) return null;
        return n > 1 ? n / 100 : n;
      })(),
      manualFactor: Fmt.parseNumber(cell('manualFactor')),
      overrideValue: Fmt.parseNumber(cell('overrideValue')),
      pinnedPool: canonPool,
      excluded: Fmt.parseBool(cell('excluded')),
      notes: cell('notes') == null ? '' : String(cell('notes')).trim()
    };
  }

  function rowsToPeople(grid, state, mapping) {
    var rows = grid || [];
    var headers = (rows[0] || []).map(function (h) { return h == null ? '' : String(h); });
    var map = mapping || autoMap(headers);
    var tierNames = Object.keys((state && state.tiers) || {});
    var poolNames = Object.keys((state && state.pools) || {});
    var body = rows.slice(1).filter(function (r) {
      if (!r) return false;
      for (var i = 0; i < r.length; i++) {
        if (r[i] != null && String(r[i]).trim() !== '') return true;
      }
      return false;
    });
    var people = body.map(function (row, i) {
      return rowToPerson(row, map, i + 1, tierNames, poolNames);
    });
    return { headers: headers, mapping: map, people: people };
  }

  return {
    FIELDS: FIELDS,
    autoMap: autoMap,
    rowToPerson: rowToPerson,
    rowsToPeople: rowsToPeople
  };
})();

  function viewRows() {
    var rows = rowsCache();
    var f = state.filters;
    var hit = null;
    if (f.q) {
      var res = Search.run(searchIndex(), f.q);
      hit = res ? res.ids : null;
      state.__lastNeedle = res ? res.needle : '';
    } else {
      state.__lastNeedle = '';
    }
    var out = rows.filter(function (r) {
      if (hit && !hit[r.id]) return false;
      if (f.dept && r.dept !== f.dept) return false;
      if (f.tier && r.tier !== f.tier) return false;
      if (f.pool && r.pool !== f.pool) return false;
      for (var i = 0; i < f.flags.length; i++) {
        var def = FLAGS.filter(function (x) { return x.key === f.flags[i]; })[0];
        if (def && !def.test(r)) return false;
      }
      return true;
    });
    if (state.sort.key && state.sort.dir) {
      var col = COLUMNS.filter(function (c) { return c.key === state.sort.key; })[0];
      if (col) out = Sorter.sortRows(out, state.sort.key, state.sort.dir, function (r) { return col.get(r); });
    }
    return out;
  }

    var seen = Object.create(null);

  function readCsv(text) {
    var rows = [];
    var row = [];
    var cur = '';
    var inQ = false;
    for (var i = 0; i < text.length; i++) {
      var ch = text[i];
      if (inQ) {
        if (ch === '"') {
          if (text[i + 1] === '"') { cur += '"'; i++; }
          else inQ = false;
        } else cur += ch;
        continue;
      }
      if (ch === '"') { inQ = true; continue; }
      if (ch === ',' || ch === ';' || ch === '\t') { row.push(cur); cur = ''; continue; }
      if (ch === '\n') { row.push(cur); rows.push(row); row = []; cur = ''; continue; }
      if (ch === '\r') continue;
      cur += ch;
    }
    if (cur !== '' || row.length) { row.push(cur); rows.push(row); }
    return rows.filter(function (r) { return r.some(function (c) { return String(c).trim() !== ''; }); });
  }

  function handleFile(file) {
    var reader = new FileReader();
    var isCsv = /\.csv$/i.test(file.name);
    if (!isCsv && typeof XLSX === 'undefined') {
      UI.toast('محرك Excel غير محمّل (يحتاج اتصالًا بالإنترنت مرة واحدة). احفظ ملفك كـ CSV وارفعه — كل شيء آخر يعمل بدون إنترنت.', 'danger');
      return;
    }
    reader.onerror = function () { UI.toast('تعذّر قراءة الملف', 'danger'); };
    reader.onload = function (e) {
      var rows;
      try {
        if (isCsv) {
          var text = typeof e.target.result === 'string' ? e.target.result : new TextDecoder('utf-8').decode(e.target.result);
          if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
          rows = readCsv(text);
        } else {
          var wb = XLSX.read(new Uint8Array(e.target.result), { type: 'array' });
          var first = wb.SheetNames[0];
          rows = XLSX.utils.sheet_to_json(wb.Sheets[first], { header: 1, blankrows: false, defval: '' });
        }
      } catch (err) {
        UI.toast('الملف غير مقروء — تأكد أنه Excel أو CSV صحيح', 'danger');
        return;
      }
      if (!rows || rows.length < 2) {
        UI.toast('الملف يحتاج صف عناوين وصف بيانات واحد على الأقل', 'warn');
        return;
      }
      state.headers = rows[0].map(function (h, i) { return String(h == null || h === '' ? 'عمود ' + (i + 1) : h).trim(); });
      state.rawRows = rows.slice(1);
      state.fileName = file.name;
      state.mapping = autoMap(state.headers);
      state.people = [];
      state.result = null;
      state.undoStack = []; state.redoStack = [];
      goto('map');
      UI.toast('تم تحميل ' + Fmt.int(state.rawRows.length) + ' صف — راجع ربط الأعمدة', 'ok');
    };
    if (isCsv) reader.readAsArrayBuffer(file); else reader.readAsArrayBuffer(file);
  }

  function renderAmountsSummary() {
    if (!hosts.amountsSummary) return;

    var effective = names.reduce(function (s, n) { return s + Engine.fromPiastres(Engine.effectiveGrossPiastres(state.pools[n].gross, state.options.roundingStep)); }, 0);

      Math.abs(effective - gross) < 0.005 ? 'ok' : 'warn'));

      'يتغيّر مباشرة مع الأرقام أعلاه', 'flat'));

    var c = el('div', 'kpi' + (tone ? ' kpi-' + tone : ''));

    c.appendChild(l);

    v.appendChild(valueNode);

  function addPool() {
    var base = 'مجمع جديد';
    var name = base, i = 2;
    while (state.pools[name]) { name = base + ' ' + i; i++; }
    state.pools[name] = { gross: 0, taxRate: 0 };
    recompute();
    renderScreen();
  }

  function renamePool(oldName, newName) {
    var trimmed = String(newName || '').trim();
    if (!trimmed || trimmed === oldName) { renderScreen(); return; }
    if (state.pools[trimmed]) {
      UI.toast('يوجد مجمع بنفس الاسم', 'warn');
      renderScreen();
      return;
    }
    var rebuilt = {};
    Object.keys(state.pools).forEach(function (k) {
      rebuilt[k === oldName ? trimmed : k] = state.pools[k];
    });
    state.pools = rebuilt;
    state.people.forEach(function (p) { if (p.pinnedPool === oldName) p.pinnedPool = trimmed; });
    if (state.filters.pool === oldName) state.filters.pool = trimmed;
    recompute();
    renderScreen();
  }

  function removePool(name) {
    var pinnedCount = state.people.filter(function (p) { return p.pinnedPool === name; }).length;
    UI.confirmModal({
      title: 'حذف مجمع "' + name + '"؟',
      message: pinnedCount > 0
        ? 'يوجد ' + Fmt.int(pinnedCount) + ' شخص مقفول على هذا المجمع. سيتم فك القفل عنهم وإعادة توزيعهم تلقائيًا.'
        : 'سيُحذف المجمع ومبلغه من الحساب.',
      confirmLabel: 'حذف', danger: true,
      onConfirm: function () {
        delete state.pools[name];
        state.people.forEach(function (p) { if (p.pinnedPool === name) p.pinnedPool = null; });
        if (state.filters.pool === name) state.filters.pool = '';
        recompute();
        renderScreen();
        UI.toast('تم حذف المجمع', 'ok');
      }
    });
  }
  var WARN_LABELS = {
    MISSING_NAME: 'صفوف بدون اسم',
    UNRESOLVED_TIER: 'أشخاص بدون فئة معروفة',
    BAD_PENALTY: 'نسب جزاء خارج النطاق',
    BAD_DAYS: 'أيام عمل خارج نطاق الفترة',
    BAD_MANUAL_FACTOR: 'معاملات يدوية غير صالحة',
    POOL_ROUNDED: 'مجمعات عُدّل إجماليها للتقريب',
    ZERO_BUDGET_POOL: 'مجمعات بلا مبلغ'
  };

  function groupWarnings(result) {
    var groups = Object.create(null);
    ((result && result.warnings) || []).forEach(function (w) {
      if (!groups[w.code]) groups[w.code] = [];
      groups[w.code].push(w);
    });
    return groups;
  }

  function unresolvedBanner() {
    var ids = (state.result && state.result.unresolvedTierIds) || [];
    if (!ids.length) return null;
    var names = state.people.filter(function (p) { return ids.indexOf(p.id) !== -1; })
      .map(function (p) { return p.name || ('صف ' + p.id); });
    var preview = names.slice(0, 4).join('، ') + (names.length > 4 ? ' و' + Fmt.int(names.length - 4) + ' غيرهم' : '');
    return UI.notice({
      tone: 'danger',
      title: Fmt.int(ids.length) + ' شخص بدون فئة معروفة — تم استبعادهم من التوزيع',
      text: preview + '. هؤلاء لم يحصلوا على أي مبلغ لأن فئتهم غير معرّفة في الإعدادات. القرار عليك: عرّف فئتهم، أو أعطهم قيمة مخصصة، أو استبعدهم رسميًا. سيظهرون في ورقة «بدون فئة» في كل تقرير مُصدَّر.',
      actions: [
        btn('أرِني هؤلاء', {
          variant: 'primary', size: 'sm', onClick: function () {
            state.filters = { q: '', dept: '', tier: '', pool: '', flags: ['unresolved'] };

            renderScreen();
          }
        }),
        btn('تعريف الفئات', { size: 'sm', onClick: function () { openSettings('tiers'); } }),
        btn('استبعادهم رسميًا', {
          size: 'sm', variant: 'danger', onClick: function () {
            UI.confirmModal({
              title: 'استبعاد ' + Fmt.int(ids.length) + ' شخص رسميًا؟',
              message: 'سيُعلَّمون كـ«مستبعد» بقرار صريح منك، ويظهرون في ورقة المستبعدين بدل ورقة «بدون فئة». النتيجة المالية نفسها — الفرق أن القرار مسجَّل باسمك.',
              confirmLabel: 'استبعادهم', danger: true,

  function errorPanel(result) {
    var box = el('div', 'notice notice-danger');
    box.appendChild(Icons.svg('danger', 'notice-icon'));
    var body = el('div', 'notice-body');
    body.appendChild(el('div', 'notice-title', 'تعذّر إكمال الحساب'));
    var list = el('ul');
    list.style.margin = 'var(--s2) 0 0';
    list.style.paddingInlineStart = 'var(--s4)';
    (result.errors || []).forEach(function (e) {
      list.appendChild(el('li', 'small', e.message || e.code));
    });
    body.appendChild(list);
    var acts = [];
    var codes = (result.errors || []).map(function (e) { return e.code; });
    if (codes.indexOf('NO_POOLS') !== -1 || codes.indexOf('BAD_TAX_RATE') !== -1 || codes.indexOf('BAD_GROSS') !== -1 || codes.indexOf('EMPTY_POOL_WITH_BUDGET') !== -1) {
      acts.push(btn('تعديل المجمعات', { variant: 'primary', size: 'sm', onClick: function () { goto('amounts'); } }));
    }
    if (codes.indexOf('UNKNOWN_PINNED_POOL') !== -1) {
      acts.push(btn('مراجعة الأقفال', { size: 'sm', onClick: function () { openSettings('pools'); } }));
    }
    if (codes.indexOf('NO_ELIGIBLE_PEOPLE') !== -1) {
      acts.push(btn('تعريف الفئات', { variant: 'primary', size: 'sm', onClick: function () { openSettings('tiers'); } }));
    }
    if (acts.length) body.appendChild(append(el('div', 'notice-actions'), acts));
    box.appendChild(body);
    return box;
  }

  function pushUndo(label) {
    state.undoStack.push({ label: label, people: JSON.parse(JSON.stringify(state.people)) });
    if (state.undoStack.length > 40) state.undoStack.shift();
    state.redoStack = [];
  }

  function undo() {
    if (!state.undoStack.length) return;
    var entry = state.undoStack.pop();
    state.redoStack.push({ label: entry.label, people: JSON.parse(JSON.stringify(state.people)) });
    state.people = entry.people;
    recompute();
    renderScreen();
    UI.toast('تم التراجع عن: ' + entry.label, 'ok');
  }

  function redo() {
    if (!state.redoStack.length) return;
    var entry = state.redoStack.pop();
    state.undoStack.push({ label: entry.label, people: JSON.parse(JSON.stringify(state.people)) });
    state.people = entry.people;
    recompute();
    renderScreen();
    UI.toast('تمت إعادة: ' + entry.label, 'ok');
  }

    if (!state.result) recompute();

    var notices = el('div', 'stack g3');
    notices.style.marginBottom = 'var(--s4)';

      notices.appendChild(errorPanel(state.result));

  function gridRows() {
    var rows = state.people;
    if (state.gridOnlyProblems) {
      var ids = Object.create(null);
      ((state.result && state.result.warnings) || []).forEach(function (w) { if (w.personId != null) ids[w.personId] = true; });
      rows = rows.filter(function (p) { return ids[p.id] || Reports.isSpecial(p); });
    }
    var q = state.filters.q;
    if (q) {
      var needle = Engine.normalizeLoose(q);
      rows = rows.filter(function (p) {
        return Engine.normalizeLoose(p.name).indexOf(needle) !== -1 || Engine.normalizeLoose(p.dept).indexOf(needle) !== -1;
      });
    }
    return rows;
  }

    ])));

    hosts.gridBody = el('div');

  function renderGridBody(slice, rows, pages) {
    if (!hosts.gridBody) return;
    if (!rows) {
      rows = gridRows();
      var per = state.ui.rowsPerPage;
      pages = Math.max(1, Math.ceil(rows.length / per));
      if (state.page.grid > pages) state.page.grid = pages;
      slice = rows.slice((state.page.grid - 1) * per, (state.page.grid - 1) * per + per);
    }
    var snap = captureFocus();
    clearNode(hosts.gridBody);

    if (!rows.length) {
      hosts.gridBody.appendChild(el('div', 'card', UI.emptyState(
        state.filters.q ? 'لا نتائج للبحث' : 'لا صفوف مطابقة',
        state.filters.q ? 'جرّب كلمة أقصر أو امسح البحث.' : 'أزل فلتر «الصفوف بها مشاكل فقط».',
        btn('مسح الفلاتر', { onClick: function () { state.filters.q = ''; state.gridOnlyProblems = false; renderGrid(); } })
      )));
      return;
    }

    var rmap = resultIndex();
    var tierNames = Object.keys(state.tiers);
    var poolNames = Object.keys(state.pools);

    var tw = el('div', 'table-wrap h-lg');
    var t = el('table', 'dt dt-wide compact');
    var thead = el('thead');
    var htr = el('tr');
    htr.appendChild(el('th', null, '#'));
    GRID_FIELDS.forEach(function (f) {
      var th = el('th', f.numeric ? 'num-col' : null, f.label);
      th.style.minWidth = f.width;
      htr.appendChild(th);
    });
    htr.appendChild(el('th', 'num-col', 'الصافي'));
    thead.appendChild(htr);
    t.appendChild(thead);

    var tb = el('tbody');
    slice.forEach(function (p) {
      var r = rmap[p.id] || {};
      var tr = el('tr');
      if (r.unresolvedTier) tr.className = 'is-orphan';
      else if (p.excluded) tr.className = 'is-excluded';
      else if (Reports.isSpecial(p)) tr.className = 'is-special';
      tr.appendChild(el('td', 'small muted', String(p.id)));

      GRID_FIELDS.forEach(function (f) {
        var td = el('td', f.numeric ? 'num-col' : null);
        td.appendChild(gridCell(p, f, tierNames, poolNames));
        tr.appendChild(td);
      });

      var net = el('td', 'num-col');

        net.appendChild(UI.badge('بدون فئة', 'danger'));

      }
      tr.appendChild(net);
      tb.appendChild(tr);
    });

<script>
(function(){try{
  var raw = localStorage.getItem('qisma.settings.v1');
  var ui = raw ? (JSON.parse(raw).ui || {}) : {};
  var pref = ui.theme === 'light' || ui.theme === 'dark' ? ui.theme : 'system';
  var dark = pref === 'dark' || (pref === 'system' && matchMedia('(prefers-color-scheme:dark)').matches);
  var r = document.documentElement;
  r.setAttribute('data-theme', dark ? 'dark' : 'light');
  r.setAttribute('data-theme-pref', pref);
  if (ui.motion === 'reduced') r.setAttribute('data-motion', 'reduced');
  var m = document.getElementById('theme-color');
  if (m) m.setAttribute('content', dark ? '#1A1A18' : '#F0EEE6');
}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
</script>

<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head><meta charset="utf-8"><title>اختبارات قِسمة</title></head>
<body>
<h1>نتائج اختبارات قِسمة</h1>
<output id="results">جارٍ الاختبار…</output>
<iframe src="qisma.html" title="تطبيق قِسمة" hidden></iframe>
<script>
document.querySelector('iframe').addEventListener('load', async function () {
  try {
    var win = this.contentWindow;
    var results = win.SelfTest.run();
    var failed = results.filter(function (r) { return !r.pass; });
    var wait = function () { return new Promise(function (resolve) { setTimeout(resolve, 550); }); };
    var find = function (selector, text) {
      return Array.from(win.document.querySelectorAll(selector)).find(function (node) { return node.textContent.indexOf(text) !== -1; });
    };
    find('button', 'تحميل بيانات تجريبية').click();
    await wait();
    var demoLoaded = win.App.internals.getState().people.length === 240;
    find('.step-pill', 'الملف').click();
    await wait();
    find('button', 'تحميل بيانات تجريبية').click();
    var protectedReplacement = !!win.document.querySelector('[role="dialog"]') && win.App.internals.getState().people.length === 240;
    find('[role="dialog"] button', 'إلغاء').click();
    find('.step-pill', 'المبالغ').click();
    await wait();
    var numericInput = Array.from(win.document.querySelectorAll('input')).find(function (input) { return input.getAttribute('aria-label') && input.getAttribute('aria-label').indexOf('نسبة خصم') !== -1; });
    var numericText = !!numericInput && numericInput.type === 'text' && numericInput.inputMode === 'decimal';
    var frame = this, stepperFits = true;
    for (var w of [1280, 1024, 860, 720, 480, 360, 320]) {
      frame.style.width = w + 'px';
      frame.hidden = false;
      await new Promise(function (resolve) { setTimeout(resolve, 150); });
      var list = win.document.querySelector('.stepper');
      if (list.scrollWidth > list.clientWidth + 1) stepperFits = false;
    }
    frame.hidden = true;

    var people = win.DemoData.people(60000, 7);
    var st0 = win.App.internals.getState();
    var input = { people: people, tiers: st0.tiers, pools: st0.pools, periodDays: st0.periodDays, options: st0.options };
    var direct = win.Engine.runPipeline(input);
    var workerOk = false, workerMs = 0;
    if (win.EngineWorker.supported()) {
      var tw0 = performance.now();
      var viaWorker = await win.EngineWorker.run(input);
      workerMs = Math.round(performance.now() - tw0);
      workerOk = viaWorker.ok && viaWorker.totals.net === direct.totals.net && viaWorker.cols.net.length === direct.cols.net.length && viaWorker.people[12345].netPiastres === direct.people[12345].netPiastres;
    }

    var streamOk = false, streamDetail = '';
    try {
      var n = 3000;
      var out = await win.XlsxStream.write([
        { name: 'تفصيل', header: ['#', 'الاسم', 'الصافي', 'نسبة'], count: n, rowAt: function (k) { return [k + 1, 'اسم <' + k + '> & "x"', (k * 37) / 100, k / n]; }, tail: [['الإجمالي', '', 1, '']], opts: { formats: { 2: '#,##0.00', 3: '0.00%' } } },
        { name: 'ملخص', rows: [['البيان', 'القيمة'], ['عدد', n]], opts: { autofilter: false } }
      ], { title: 'test' });
      var buf = new Uint8Array(await out.blob.arrayBuffer());
      var wb = win.XLSX.read(buf, { type: 'array', cellNF: true });
      var aoa = win.XLSX.utils.sheet_to_json(wb.Sheets['تفصيل'], { header: 1 });
      var cell = wb.Sheets['تفصيل']['C3'];
      var checks = [wb.SheetNames.join('|') === 'تفصيل|ملخص', aoa.length === n + 2, aoa[5] && aoa[5][1] === 'اسم <4> & "x"', aoa[n + 1] && aoa[n + 1][0] === 'الإجمالي', !!cell && cell.z === '#,##0.00'];
      streamOk = checks.every(Boolean);
      streamDetail = out.blob.size + 'B ' + (out.compressed ? 'deflate' : 'store') + ' ' + checks.map(function (c) { return c ? 1 : 0; }).join('') + ' z=' + (cell && cell.z) + ' rows=' + aoa.length;
    } catch (e) { streamDetail = String(e); }

    var st = win.App.internals.getState();
    st.ui.viewMode = 'scroll';
    find('.step-pill', 'المراجعة').click();
    await wait();
    var vRows = win.document.querySelectorAll('.vgrid-wrap tbody tr:not(.v-pad)').length;
    var virtualOk = !!win.document.querySelector('.vgrid-wrap') && vRows > 0 && vRows < 80;
    st.ui.viewMode = 'pages';

    var integration = { demoLoaded: demoLoaded, protectedReplacement: protectedReplacement, numericText: numericText, stepperFits: stepperFits, workerOk: workerOk, workerMs: workerMs, streamOk: streamOk, streamDetail: streamDetail, virtualOk: virtualOk, offlineXlsx: !!win.XLSX && !win.__sheetJsLocalFailed };
    document.getElementById('results').textContent = (results.length - failed.length) + '/' + results.length + ' ناجح\n' + JSON.stringify(integration);
    console.log('QISMA_TESTS ' + JSON.stringify({ total: results.length, failed: failed, integration: integration }));
    console.log('QISMA_PERF ' + JSON.stringify(results.filter(function (r) { return /^(S2|S3|T11|T22)/.test(r.name); }).map(function (r) { return r.name.slice(0, 3) + ': ' + r.detail; })));
  } catch (error) {
    document.getElementById('results').textContent = error.stack || String(error);
    console.error(error);
  }
});
</script>
</body>
</html>
